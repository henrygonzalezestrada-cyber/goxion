<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOXION // ADMIN SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030305;
            --card-bg: #0a0a0f;
            --neon-green: #00ff9d;
            --neon-purple: #bc13fe;
            --neon-red: #ff003c;
            --text-main: #ffffff;
            --text-muted: #8892b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; overflow-x: hidden; }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; border-bottom: 1px solid var(--neon-purple);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2); margin-bottom: 15px;
            border-radius: 8px; background: rgba(10, 10, 15, 0.8); gap: 10px;
        }
        .logo-area h1 { font-size: 1.4rem; text-shadow: 0 0 10px var(--neon-purple); letter-spacing: 2px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .status { color: var(--neon-green); font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%; animation: pulse 1.5s infinite; }
        .btn-save { background: transparent; color: var(--neon-green); border: 1px solid var(--neon-green); padding: 6px 12px; font-weight: 700; cursor: pointer; border-radius: 4px; transition: 0.3s; font-size: 0.85rem; }
        .btn-save:hover { background: var(--neon-green); color: #000; }
        .btn-logout { background: transparent; color: var(--neon-red); border: 1px solid var(--neon-red); padding: 6px 12px; font-weight: 700; cursor: pointer; border-radius: 4px; transition: 0.3s; font-size: 0.85rem; }
        .btn-logout:hover { background: var(--neon-red); color: #fff; }

        @media (max-width: 600px) {
            header { flex-wrap: wrap; }
            .header-actions { width: 100%; justify-content: space-between; margin-top: 5px; }
        }

        /* --- SECTIONS & PANELS --- */
        .section-title { color: var(--neon-purple); font-size: 1.2rem; margin-bottom: 12px; text-transform: uppercase; border-left: 3px solid var(--neon-purple); padding-left: 8px; }
        .grid-container { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; }
        @media (max-width: 900px) { .grid-container { grid-template-columns: 1fr; } }
        
        .panel { background-color: var(--card-bg); border: 1px solid rgba(188, 19, 254, 0.3); border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        
        /* Switches & Inputs */
        .switch-row, .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: transparent; border: 1px solid var(--neon-red); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--neon-red); }

        .price-input-group { display: flex; align-items: center; gap: 3px; background: #111; padding: 3px 8px; border: 1px solid rgba(188, 19, 254, 0.5); border-radius: 4px; }
        .price-input-group input { background: transparent; border: none; color: var(--neon-green); font-weight: bold; width: 40px; text-align: right; outline: none; }

        .search-bar { width: 100%; background: #111; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 8px; border-radius: 4px; margin-bottom: 12px; font-size: 0.9rem; }

        /* --- CLIENT CARD --- */
        .client-card {
            background: linear-gradient(145deg, #0f0f16, #0a0a0f);
            border-left: 3px solid var(--neon-green);
            padding: 10px; border-radius: 6px; margin-bottom: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .card-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .client-info h3 { color: var(--neon-green); font-size: 1rem; }
        .client-info p { color: var(--text-muted); font-size: 0.8rem; }

        .card-actions-row { display: flex; gap: 6px; align-items: center; width: 100%; }
        .loyalty-control { display: flex; align-items: center; gap: 4px; background: #1a1a24; padding: 3px 6px; border-radius: 4px; }
        .loyalty-btn { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); width: 20px; height: 20px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

        .btn-copy { background: transparent; border: 1px solid var(--neon-purple); color: var(--neon-purple); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; text-align: center; }
        .btn-copy:hover { background: var(--neon-purple); color: #fff; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(0, 255, 157, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area"><h1>GOXION // ADMIN</h1></div>
        <div class="status"><div class="status-dot"></div> ONLINE</div>
        <div class="header-actions">
            <button class="btn-save" onclick="prepararYGuardar()">Guardar Cambios</button>
            <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
        </div>
    </header>

    <div class="grid-container">
        <!-- COLUMNA IZQUIERDA -->
        <div>
            <!-- ALERTAS -->
            <div class="panel">
                <h2 class="section-title">Alertas (Ayuda)</h2>
                <div class="switch-row">
                    <span style="font-size: 0.85rem;">Falla YouTube Prem.</span>
                    <label class="switch"><input type="checkbox" id="alert-yt"><span class="slider"></span></label>
                </div>
                <div class="switch-row">
                    <span style="font-size: 0.85rem;">Falla Netflix</span>
                    <label class="switch"><input type="checkbox" id="alert-ntf"><span class="slider"></span></label>
                </div>
                <textarea id="global-msg" style="width: 100%; background: #111; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px; border-radius: 4px; margin-top: 4px; font-size: 0.8rem;" placeholder="Mensaje Global..."></textarea>
            </div>

            <!-- PRECIOS -->
            <div class="panel">
                <h2 class="section-title">Precios Base ($)</h2>
                <div class="price-row">
                    <span style="font-size: 0.85rem;">YouTube Prem.</span>
                    <div class="price-input-group">
                        <span style="color:var(--neon-green); font-size:0.8rem;">$</span>
                        <input type="number" id="price-yt" value="89">
                    </div>
                </div>
                <div class="price-row">
                    <span style="font-size: 0.85rem;">Netflix</span>
                    <div class="price-input-group">
                        <span style="color:var(--neon-green); font-size:0.8rem;">$</span>
                        <input type="number" id="price-ntf" value="109">
                    </div>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: CLIENTES -->
        <div class="panel">
            <h2 class="section-title">Gestión de Cuentas</h2>
            <input type="text" class="search-bar" id="search-input" placeholder="Buscar cliente por nombre o folio..." oninput="filtrarClientes()">

            <!-- Contenedor dinámico de clientes -->
            <div id="clients-container">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Cargando clientes desde GitHub...</p>
            </div>
        </div>
    </div>

    <!-- EL NUEVO SCRIPT CORRECTO -->
    <script>
    const CONFIG = {
        username: "henrygonzalezestrada-cyber",
        repo: "goxion",
        path: "clientes.json",
        branch: "main"
    };

    let currentToken = localStorage.getItem("GOXION_PAT") || "";
    let currentFileData = null; 
    let clientesDict = {}; 
    let configGlobal = { alertas: {}, precios: {} };

    document.addEventListener("DOMContentLoaded", () => {
        if (!currentToken) pedirToken();
        else inicializarPanel();
    });

    function pedirToken() {
        const userToken = prompt("🔒 ACCESO RESTRINGIDO // GOXION ADMIN\n\nIngresa tu Personal Access Token:");
        if (userToken && userToken.trim() !== "") {
            currentToken = userToken.trim();
            localStorage.setItem("GOXION_PAT", currentToken);
            inicializarPanel();
        } else {
            alert("Acceso denegado.");
        }
    }

    function cerrarSesion() {
        localStorage.removeItem("GOXION_PAT");
        location.reload();
    }

    async function inicializarPanel() {
        const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}`;
        
        try {
            const response = await fetch(url, {
                headers: { "Authorization": `token ${currentToken}`, "Accept": "application/vnd.github.v3+json" },
                cache: "no-store"
            });

            if (response.status === 401) return cerrarSesion();

            const data = await response.json();
            const contentDecoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
            const jsonCompleto = JSON.parse(contentDecoded);
            
            currentFileData = { sha: data.sha };

            if (jsonCompleto._goxion_config) {
                configGlobal = jsonCompleto._goxion_config;
                delete jsonCompleto._goxion_config; 
            }

            clientesDict = jsonCompleto;

            document.getElementById("alert-yt").checked = configGlobal.alertas?.youtube || false;
            document.getElementById("alert-ntf").checked = configGlobal.alertas?.netflix || false;
            document.getElementById("global-msg").value = configGlobal.alertas?.mensaje || "";
            document.getElementById("price-yt").value = configGlobal.precios?.youtube || 89;
            document.getElementById("price-ntf").value = configGlobal.precios?.netflix || 109;

            renderizarClientes(clientesDict);

        } catch (error) {
            console.error("Error GitHub:", error);
        }
    }

    function renderizarClientes(diccionario) {
        const container = document.getElementById("clients-container");
        container.innerHTML = "";

        const keys = Object.keys(diccionario);
        if (keys.length === 0) {
            container.innerHTML = `<p style="color: var(--text-muted);">No se encontraron clientes.</p>`;
            return;
        }

        keys.forEach(key => {
            const cliente = diccionario[key];
            
            let subtotal = 0;
            let nombresServicios = [];
            if(cliente.servicios) {
                cliente.servicios.forEach(s => {
                    subtotal += s.monto;
                    nombresServicios.push(s.nombre);
                });
            }

            const card = document.createElement("div");
            card.className = "client-card";
            card.innerHTML = `
                <div class="card-header-row">
                    <div class="client-info">
                        <h3>[${cliente.folio}] ${cliente.nombre}</h3>
                        <p style="font-size: 0.75rem;">${nombresServicios.join(', ')} ($${subtotal})</p>
                    </div>
                </div>

                <div class="card-actions-row" style="margin-top: 10px;">
                    <div class="loyalty-control" title="Pagos Puntuales">
                        <button class="loyalty-btn" onclick="updatePagos('${key}', -1)">-</button>
                        <span id="pagos-${key}" style="font-weight: bold; width: 14px; text-align: center; color: var(--neon-green); font-size: 0.8rem;">${cliente.pagos_puntuales || 0}</span>
                        <button class="loyalty-btn" onclick="updatePagos('${key}', 1)">+</button>
                    </div>

                    <button class="btn-copy" onclick="copiarInfo('${cliente.nombre}', '${key}')" style="flex:1;">Copiar Link Cobro</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function updatePagos(key, delta) {
        clientesDict[key].pagos_puntuales = Math.max(0, (clientesDict[key].pagos_puntuales || 0) + delta);
        document.getElementById(`pagos-${key}`).innerText = clientesDict[key].pagos_puntuales;
    }

    function copiarInfo(nombre, key) {
        const link = `https://henrygonzalezestrada-cyber.github.io/goxion/index.html?cliente=${key}`;
        navigator.clipboard.writeText(`Hola ${nombre}, aquí tienes tu estado de cuenta actualizado:\n${link}`);
        alert("¡Link de cobro copiado al portapapeles!");
    }

    function filtrarClientes() {
        const query = document.getElementById("search-input").value.toLowerCase();
        const filtrados = {};
        
        Object.keys(clientesDict).forEach(key => {
            const c = clientesDict[key];
            if (c.nombre.toLowerCase().includes(query) || c.folio.toLowerCase().includes(query)) {
                filtrados[key] = c;
            }
        });
        renderizarClientes(filtrados);
    }

    async function prepararYGuardar() {
        if (!currentFileData) return;
        const btnSave = document.querySelector('.btn-save');
        btnSave.innerText = "Guardando...";

        configGlobal = {
            alertas: {
                youtube: document.getElementById("alert-yt").checked,
                netflix: document.getElementById("alert-ntf").checked,
                mensaje: document.getElementById("global-msg").value
            },
            precios: {
                youtube: parseInt(document.getElementById("price-yt").value) || 89,
                netflix: parseInt(document.getElementById("price-ntf").value) || 109
            }
        };

        const dataToSave = { 
            _goxion_config: configGlobal,
            ...clientesDict 
        };

        const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}`;
        const jsonString = JSON.stringify(dataToSave, null, 2);
        const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

        const payload = {
            message: "🤖 Admin Update: Plataforma y lealtad actualizados",
            content: contentEncoded,
            sha: currentFileData.sha,
            branch: CONFIG.branch
        };

        try {
            const response = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${currentToken}`, "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const resData = await response.json();
                currentFileData.sha = resData.content.sha;
                alert("⚡ ¡CAMBIOS GUARDADOS EXITOSAMENTE!");
            } else {
                alert("❌ Error al guardar.");
            }
        } catch (error) {
            console.error(error);
        }
        btnSave.innerText = "Guardar Cambios";
    }
    </script>
</body>
</html>
