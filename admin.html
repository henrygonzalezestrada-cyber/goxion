<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOXION // ADMIN SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030305;
            --card-bg: #0a0a0f;
            --neon-green: #00ff9d;
            --neon-purple: #bc13fe;
            --neon-red: #ff003c;
            --text-main: #ffffff;
            --text-muted: #8892b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; overflow-x: hidden; }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; border-bottom: 1px solid var(--neon-purple);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2); margin-bottom: 15px;
            border-radius: 8px; background: rgba(10, 10, 15, 0.8); gap: 10px;
        }
        .logo-area h1 { font-size: 1.4rem; text-shadow: 0 0 10px var(--neon-purple); letter-spacing: 2px; }
        .status { color: var(--neon-green); font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%; animation: pulse 1.5s infinite; }
        .btn-save { background: transparent; color: var(--neon-green); border: 1px solid var(--neon-green); padding: 6px 12px; font-weight: 700; cursor: pointer; border-radius: 4px; transition: 0.3s; font-size: 0.85rem; }

        @media (max-width: 500px) {
            header { flex-wrap: wrap; }
            .btn-save { width: 100%; margin-top: 5px; }
        }

        /* --- SECTIONS & PANELS --- */
        .section-title { color: var(--neon-purple); font-size: 1.2rem; margin-bottom: 12px; text-transform: uppercase; border-left: 3px solid var(--neon-purple); padding-left: 8px; }
        .grid-container { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; }
        @media (max-width: 900px) { .grid-container { grid-template-columns: 1fr; } }
        
        .panel { background-color: var(--card-bg); border: 1px solid rgba(188, 19, 254, 0.3); border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        
        /* Swtiches & Inputs */
        .switch-row, .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: transparent; border: 1px solid var(--neon-red); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--neon-red); }

        .price-input-group { display: flex; align-items: center; gap: 3px; background: #111; padding: 3px 8px; border: 1px solid rgba(188, 19, 254, 0.5); border-radius: 4px; }
        .price-input-group input { background: transparent; border: none; color: var(--neon-green); font-weight: bold; width: 40px; text-align: right; outline: none; }

        .search-bar { width: 100%; background: #111; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 8px; border-radius: 4px; margin-bottom: 12px; font-size: 0.9rem; }

        /* --- CLIENT CARD (OPTIMIZADO PARA MÓVIL) --- */
        .client-card {
            background: linear-gradient(145deg, #0f0f16, #0a0a0f);
            border-left: 3px solid var(--neon-green);
            padding: 10px; border-radius: 6px; margin-bottom: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .card-header-row {
            display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
        }

        .client-info h3 { color: var(--neon-green); font-size: 1rem; }
        .client-info p { color: var(--text-muted); font-size: 0.8rem; }

        /* Controles horizontales compactos */
        .card-actions-row {
            display: flex; gap: 6px; align-items: center; width: 100%;
        }

        .loyalty-control { display: flex; align-items: center; gap: 4px; background: #1a1a24; padding: 3px 6px; border-radius: 4px; }
        .loyalty-btn { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); width: 20px; height: 20px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

        select.status-dropdown { background: #111; color: var(--text-main); border: 1px solid #555; padding: 4px; border-radius: 4px; font-size: 0.8rem; flex: 1; }
        .btn-copy { background: transparent; border: 1px solid var(--neon-purple); color: var(--neon-purple); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }

        .date-input-group { display: flex; align-items: center; gap: 6px; background: #111; padding: 4px 8px; border: 1px solid rgba(188, 19, 254, 0.4); border-radius: 4px; margin-top: 2px; }
        .date-input-group input { background: transparent; border: none; color: var(--text-main); font-size: 0.8rem; width: 100%; outline: none; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(0, 255, 157, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area"><h1>GOXION // ADMIN</h1></div>
        <div class="status"><div class="status-dot"></div> ONLINE</div>
        <button class="btn-save">Guardar Cambios</button>
    </header>

    <div class="grid-container">
        <!-- COLUMNA IZQUIERDA -->
        <div>
            <!-- ALERTAS -->
            <div class="panel">
                <h2 class="section-title">Alertas (Ayuda)</h2>
                <div class="switch-row">
                    <span style="font-size: 0.85rem;">Falla YouTube Prem.</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="switch-row">
                    <span style="font-size: 0.85rem;">Falla Netflix</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <textarea style="width: 100%; background: #111; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px; border-radius: 4px; margin-top: 4px; font-size: 0.8rem;" placeholder="Mensaje Global..."></textarea>
            </div>

            <!-- PRECIOS -->
            <div class="panel">
                <h2 class="section-title">Precios Base ($)</h2>
                <div class="price-row">
                    <span style="font-size: 0.85rem;">YouTube Prem.</span>
                    <div class="price-input-group">
                        <span style="color:var(--neon-green); font-size:0.8rem;">$</span><input type="number" value="49">
                    </div>
                </div>
                <div class="price-row">
                    <span style="font-size: 0.85rem;">Netflix</span>
                    <div class="price-input-group">
                        <span style="color:var(--neon-green); font-size:0.8rem;">$</span><input type="number" value="109">
                    </div>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: CLIENTES -->
        <div class="panel">
            <h2 class="section-title">Gestión de Cuentas</h2>
            <input type="text" class="search-bar" placeholder="Buscar cliente...">

            <!-- Client Card 1 -->
            <div class="client-card">
                <div class="card-header-row">
                    <div class="client-info">
                        <h3>[GX-101] Carlos Pérez</h3>
                        <p>YouTube Premium</p>
                    </div>
                </div>

                <!-- Campo Día de Pago -->
                <div class="date-input-group">
                    <span style="color: var(--text-muted); font-size: 0.75rem; white-space: nowrap;">Día pago:</span>
                    <input type="text" value="15 de cada mes" placeholder="Ej: 15 y 20">
                </div>

                <!-- Fila de Acciones/Botones organizada horizontalmente -->
                <div class="card-actions-row">
                    <div class="loyalty-control">
                        <button class="loyalty-btn" onclick="updateMonths('gx101', -1)">-</button>
                        <span id="months-gx101" style="font-weight: bold; width: 14px; text-align: center; color: var(--neon-green); font-size: 0.8rem;">4</span>
                        <button class="loyalty-btn" onclick="updateMonths('gx101', 1)">+</button>
                    </div>

                    <select class="status-dropdown">
                        <option value="activo" selected>Al día</option>
                        <option value="vencer">Por vencer</option>
                        <option value="inactivo">Suspendido</option>
                    </select>

                    <button class="btn-copy">Copiar</button>
                </div>
            </div>

            <!-- Client Card 2 -->
            <div class="client-card">
                <div class="card-header-row">
                    <div class="client-info">
                        <h3>[GX-102] Ana Gómez</h3>
                        <p>Netflix Premium, Disney+</p>
                    </div>
                </div>

                <!-- Campo Día de Pago -->
                <div class="date-input-group">
                    <span style="color: var(--text-muted); font-size: 0.75rem; white-space: nowrap;">Día pago:</span>
                    <input type="text" value="Día 15 (NTF) y 22 (DSN)" placeholder="Ej: 15 y 20">
                </div>

                <!-- Fila de Acciones/Botones organizada horizontalmente -->
                <div class="card-actions-row">
                    <div class="loyalty-control">
                        <button class="loyalty-btn" onclick="updateMonths('gx102', -1)">-</button>
                        <span id="months-gx102" style="font-weight: bold; width: 14px; text-align: center; color: var(--neon-green); font-size: 0.8rem;">0</span>
                        <button class="loyalty-btn" onclick="updateMonths('gx102', 1)">+</button>
                    </div>

                    <select class="status-dropdown">
                        <option value="activo">Al día</option>
                        <option value="vencer" selected>Por vencer</option>
                        <option value="inactivo">Suspendido</option>
                    </select>

                    <button class="btn-copy">Copiar</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function updateMonths(clientId, change) {
            const monthElement = document.getElementById(`months-${clientId}`);
            let newMonths = parseInt(monthElement.innerText) + change;
            if(newMonths < 0) newMonths = 0; 
            monthElement.innerText = newMonths;
        }
    </script>
</body>
</html>
