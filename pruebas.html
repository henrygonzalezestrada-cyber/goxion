<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOXION // ADMIN SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; /* True black for OLED screens */
            --card-bg: #0a0a0f;
            --neon-green: #00ff9d;
            --neon-purple: #bc13fe;
            --neon-red: #ff003c;
            --neon-blue: #00f2fe;
            --neon-yellow: #f8e800;
            --text-main: #ffffff;
            --text-muted: #8892b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; padding-bottom: 85px; overflow-x: hidden; max-width: 1400px; margin: 0 auto; }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; border-bottom: 1px solid rgba(188, 19, 254, 0.4);
            box-shadow: 0 4px 20px rgba(188, 19, 254, 0.15); margin-bottom: 20px;
            border-radius: 12px; background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(10px);
        }
        .logo-area h1 { font-size: 1.6rem; text-shadow: 0 0 10px rgba(188, 19, 254, 0.6); letter-spacing: 2px; margin: 0;}
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .status { color: var(--neon-green); font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(0, 255, 157, 0.2); padding: 4px 10px; border-radius: 20px; background: rgba(0, 255, 157, 0.05);}
        .status-dot { width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%; animation: pulse 1.5s infinite; }
        
        .btn-save { background: linear-gradient(135deg, var(--neon-green), #00cc7d); color: #000; border: none; padding: 8px 16px; font-weight: 700; cursor: pointer; border-radius: 6px; transition: 0.3s; font-size: 0.9rem; }
        .btn-save:hover { box-shadow: 0 0 15px rgba(0, 255, 157, 0.4); transform: translateY(-1px); }
        .btn-logout { background: transparent; color: var(--neon-red); border: 1px solid var(--neon-red); padding: 8px 16px; font-weight: 700; cursor: pointer; border-radius: 6px; transition: 0.3s; font-size: 0.9rem; }
        
        /* --- BOTTOM BAR (MOBILE FIRST) --- */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(188, 19, 254, 0.3); display: flex; justify-content: space-around; align-items: center;
            padding: 10px 5px; padding-bottom: max(10px, env(safe-area-inset-bottom)); z-index: 9999;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
        }
        .bottom-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.2s; }
        .bottom-btn i { font-size: 1.3rem; font-style: normal; }
        .bottom-btn.active { color: var(--neon-blue); }
        .bottom-btn.main-action { background: linear-gradient(135deg, var(--neon-purple), #7c4dff); color: #fff; padding: 10px 18px; border-radius: 20px; box-shadow: 0 0 15px rgba(188, 19, 254, 0.4); flex-direction: row; font-size: 0.9rem; gap: 6px; }

        /* --- DASHBOARD FINANCIERO --- */
        .dashboard-scroll { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .dashboard-scroll::-webkit-scrollbar { display: none; }
        .kpi-card {
            background: linear-gradient(145deg, #12121a, #08080c); min-width: 200px; flex: 1;
            border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 12px; padding: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .kpi-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .kpi-value { font-size: 1.8rem; font-weight: bold; margin-top: 4px; }
        .val-ingresos { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }
        .val-costos { color: var(--neon-red); text-shadow: 0 0 10px rgba(255, 0, 60, 0.3); }
        .val-ganancia { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 157, 0.3); }

        /* --- FILTER PILLS --- */
        .filter-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-pill { background: #12121a; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .filter-pill.active { background: rgba(0, 242, 254, 0.1); border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
        .filter-pill.revision { border-color: var(--neon-purple); color: var(--neon-purple); }
        .filter-pill.revision.active { background: rgba(188, 19, 254, 0.2); box-shadow: 0 0 10px rgba(188, 19, 254, 0.4); }

        /* --- TABS NAVIGATION --- */
        .tabs { display: none; } /* Oculto en móvil, usaremos el bottom bar */
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- SECTIONS & PANELS --- */
        .section-title { color: var(--neon-purple); font-size: 1.1rem; margin-bottom: 15px; text-transform: uppercase; border-left: 3px solid var(--neon-purple); padding-left: 10px; }
        .panel { background-color: var(--card-bg); border: 1px solid rgba(188, 19, 254, 0.2); border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .switch-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .4s; border-radius: 24px; border: 1px solid rgba(255,255,255,0.2); }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: rgba(255, 0, 60, 0.2); border-color: var(--neon-red); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--neon-red); box-shadow: 0 0 8px var(--neon-red); }

        .search-bar, .custom-select { width: 100%; background: #12121a; border: 1px solid rgba(255,255,255,0.2); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 0.95rem; outline: none; transition: 0.3s; margin-bottom: 10px; }
        .search-bar:focus, .custom-select:focus { border-color: var(--neon-purple); box-shadow: 0 0 8px rgba(188, 19, 254, 0.3); }

        .catalog-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .catalog-table th { color: var(--text-muted); font-weight: 600; text-align: left; padding: 10px 5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .catalog-table td { padding: 8px 5px; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .catalog-table input[type="text"] { width: 100%; background: #12121a; border: 1px solid rgba(188,19,254,0.3); color: #fff; padding: 6px; border-radius: 4px; outline:none; }
        .catalog-table input[type="number"] { width: 100%; max-width: 60px; background: #12121a; border: 1px solid rgba(188,19,254,0.3); color: var(--neon-blue); padding: 6px; border-radius: 4px; text-align: center; outline:none; }
        
        .inv-badge { background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; text-align: center; display: inline-block; width: 100%; }
        .inv-ok { color: var(--neon-green); border: 1px solid rgba(0, 255, 157, 0.3); }
        .inv-warn { color: var(--neon-yellow); border: 1px solid rgba(248, 232, 0, 0.3); }
        .inv-full { color: var(--neon-red); border: 1px solid rgba(255, 0, 60, 0.3); }
        
        .btn-icon { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 4px; transition: 0.2s; border-radius: 4px; }
        .btn-add-service { background: rgba(188, 19, 254, 0.05); color: var(--neon-purple); border: 1px dashed rgba(188, 19, 254, 0.5); width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; margin-top: 15px; }

        /* --- CLIENT CARD (MOBILE OPTIMIZED) --- */
        .client-card { background: linear-gradient(145deg, #12121a, #0a0a0f); border-left: 4px solid var(--neon-green); padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header-main { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .client-info-basic h3 { color: inherit; font-size: 1.15rem; margin-bottom: 4px; }
        .client-status-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: bold; text-transform: uppercase; border: 1px solid; }
        
        /* QUICK ACTIONS BAR (ALWAYS VISIBLE) */
        .quick-actions-bar { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.1); }
        .quick-btn { flex: 1; padding: 10px 5px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; text-align: center; border: 1px solid transparent; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .qb-link { background: rgba(188, 19, 254, 0.1); border-color: rgba(188, 19, 254, 0.3); color: var(--neon-purple); }
        .qb-wa { background: rgba(0, 255, 157, 0.1); border-color: rgba(0, 255, 157, 0.3); color: var(--neon-green); }
        .qb-approve { background: linear-gradient(135deg, var(--neon-purple), #7c4dff); color: #fff; animation: pulse 2s infinite; }

        .client-details { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1); animation: fadeIn 0.3s ease; }
        .client-services-list { background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .client-service-tag { display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .client-service-tag:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0;}
        
        .cred-inputs { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .cred-inputs-row { display: flex; gap: 6px; }
        .cred-inputs input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px; border-radius: 6px; font-size: 0.85rem; outline: none; }
        .cred-inputs input:focus { border-color: var(--neon-blue); }

        .status-select { background:#12121a; color:#fff; border: 1px solid var(--text-muted); border-radius: 6px; font-size: 0.9rem; padding: 10px; outline:none; }
        .status-pagado { border-color: var(--neon-green); color: var(--neon-green); }
        .status-suspendido { border-color: var(--neon-red); color: var(--neon-red); }
        .status-pendiente { border-color: var(--neon-blue); color: var(--neon-blue); }

        @media (max-width: 768px) {
            header { display: none; } /* Ocultar header viejo en móvil, reemplazado por bottom bar y search bar */
            body { padding-top: 20px; }
            .catalog-table th, .catalog-table td { font-size: 0.75rem; padding: 8px 2px; }
            .kpi-card { min-width: 150px; padding: 12px; }
        }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(188, 19, 254, 0.5); } 70% { box-shadow: 0 0 0 8px rgba(188, 19, 254, 0); } 100% { box-shadow: 0 0 0 0 rgba(188, 19, 254, 0); } }
    </style>
</head>
<body>

    <!-- BOTTOM BAR (MOBILE UI) -->
    <div class="bottom-bar">
        <button class="bottom-btn active" onclick="switchTabMobile('tab-clientes', this)"><i>👥</i><span>Clientes</span></button>
        <button class="bottom-btn" onclick="agregarNuevoCliente()"><i>➕</i><span>Nuevo</span></button>
        <button class="bottom-btn main-action" onclick="prepararYGuardar()" id="btn-save-mobile"><i>💾</i><span>Guardar</span></button>
        <button class="bottom-btn" onclick="switchTabMobile('tab-inventario', this)"><i>📦</i><span>Catálogo</span></button>
        <button class="bottom-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i>⬆️</i><span>Subir</span></button>
    </div>

    <!-- DASHBOARD FINANCIERO SCROLLABLE -->
    <div class="dashboard-scroll">
        <div class="kpi-card">
            <div class="kpi-title">Ingresos</div>
            <div class="kpi-value val-ingresos" id="kpi-ingresos">$0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Ganancia</div>
            <div class="kpi-value val-ganancia" id="kpi-ganancias">$0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Costos</div>
            <div class="kpi-value val-costos" id="kpi-costos">$0</div>
        </div>
    </div>

    <div id="tab-clientes" class="tab-content active">
        
        <input type="text" class="search-bar" id="search-input" placeholder="🔍 Buscar cliente o folio..." oninput="filtrarClientes()">
        
        <!-- HORIZONTAL FILTER PILLS -->
        <div class="filter-scroll" id="status-pills">
            <button class="filter-pill active" onclick="setFilter('all', this)">Todos</button>
            <button class="filter-pill revision" onclick="setFilter('revision', this)">🔔 Por Validar</button>
            <button class="filter-pill" onclick="setFilter('pendiente', this)">⏳ Pendientes</button>
            <button class="filter-pill" onclick="setFilter('pagado', this)">✅ Pagados</button>
            <button class="filter-pill" onclick="setFilter('suspendido', this)">⛔ Suspendidos</button>
        </div>
        
        <select id="sort-by" class="custom-select" onchange="filtrarClientes()">
            <option value="date">Ordenar por Día de Cobro (Próximos)</option>
            <option value="name">Ordenar por Nombre (A-Z)</option>
            <option value="loyalty">Los más leales primero</option>
        </select>
            
        <div id="clients-container" style="margin-top: 15px;">
            <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center;">Conectando con la base de datos...</p>
        </div>
    </div>

    <div id="tab-inventario" class="tab-content">
        <!-- PANEL DE ASIGNACIÓN MASIVA -->
        <div class="panel">
            <h2 class="section-title">Asignación Masiva de Misiones</h2>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">
                <input type="number" id="global-misiones-desc" placeholder="% Desc" title="% de Descuento" style="flex:1; background:#12121a; border: 1px solid rgba(255,255,255,0.2); color:var(--neon-blue); border-radius:8px; padding:10px; font-weight:bold;" value="5">
            </div>
            <textarea id="global-misiones-tareas" style="width:100%; background:#12121a; border: 1px solid rgba(255,255,255,0.2); color:#fff; border-radius:8px; padding:12px; font-size: 0.9rem; resize: vertical; min-height: 80px;" placeholder="Ejemplo:
Visita nuestro catálogo [CATALOGO]
Renueva a tiempo [PAGO]
Comparte con un amigo [COMPARTIR]"></textarea>
            
            <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn-save" style="background: linear-gradient(135deg, var(--neon-purple), #7c4dff); flex: 1; padding: 12px; font-size:0.95rem;" onclick="aplicarMisionesMasivas('todos')">✅ Aplicar a TODOS</button>
                <button class="btn-logout" style="flex: 1; padding: 12px; font-size:0.95rem;" onclick="borrarMisionesMasivas()">🗑️ Borrar Misiones</button>
            </div>
        </div>

        <div class="panel">
            <h2 class="section-title">Ajustes & Alertas</h2>
            <div class="switch-row">
                <span style="font-size: 0.95rem; font-weight: bold;">Mostrar Combo GOXION</span>
                <label class="switch"><input type="checkbox" id="combo-active" onchange="toggleComboUpsell()"><span class="slider"></span></label>
            </div>
            <div class="switch-row">
                <span style="font-size: 0.95rem; font-weight: bold;">Alerta Técnica Global</span>
                <label class="switch"><input type="checkbox" id="alert-active" onchange="toggleAlertFields()"><span class="slider"></span></label>
            </div>
            <div id="alert-settings" style="opacity: 0.5; pointer-events: none; transition: 0.3s;">
                <select id="alert-platform" class="custom-select"></select>
                <select id="alert-type" class="custom-select">
                    <option value="presentando intermitencias temporales">Intermitencias temporales</option>
                    <option value="en mantenimiento programado">Mantenimiento programado</option>
                    <option value="experimentando una caída global">Caída global</option>
                    <option value="con retrasos en la entrega de pines">Retrasos en accesos</option>
                </select>
                <textarea id="global-msg" style="width: 100%; background: #12121a; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 8px; font-size: 0.9rem; outline:none; resize: vertical; min-height: 80px;" placeholder="Mensaje adicional..."></textarea>
            </div>
        </div>

        <div class="panel" style="padding: 10px;">
            <h2 class="section-title" style="padding: 10px;">Catálogo & Inventario</h2>
            <div style="overflow-x: auto;">
                <table class="catalog-table">
                    <thead>
                        <tr>
                            <th>Servicio</th>
                            <th>Venta</th>
                            <th>Costo</th>
                            <th>Ctas</th>
                            <th>Lím.</th>
                            <th title="Fijar cantidad exacta manualmente">Fijo</th>
                            <th>Disp.</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="global-services-container"></tbody>
                </table>
            </div>
            <button class="btn-add-service" onclick="addGlobalService()">+ Añadir Servicio</button>
        </div>
    </div>

    <script>
    const CONFIG = { username: "henrygonzalezestrada-cyber", repo: "goxion", path: "clientes.json", branch: "main" };
    let currentToken = localStorage.getItem("GOXION_PAT") || "";
    let currentFileData = null; 
    let clientesDict = {}; 
    let configGlobal = { alertas: {}, serviciosGlobales: [], combo_upsell: true };
    let inventarioActivo = {};
    let currentStatusFilter = 'all';

    const DEFAULT_SERVICES = [
        {nombre: "Netflix Premium", cuentas: 1, precio: 109, costo: 369, limite: 4},
        {nombre: "Disney+ Premium", cuentas: 2, precio: 89, costo: 340, limite: 10},
        {nombre: "Max Standard", cuentas: 2, precio: 79, costo: 358, limite: 8},
        {nombre: "Prime Video", cuentas: 1, precio: 39, costo: 7, limite: 5}
    ];

    document.addEventListener("DOMContentLoaded", () => {
        if (!currentToken) pedirToken();
        else inicializarPanel();
    });

    function switchTabMobile(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.bottom-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        window.scrollTo({top:0, behavior:'smooth'});
    }

    function setFilter(val, btn) {
        currentStatusFilter = val;
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        filtrarClientes();
    }

    function toggleClientDetails(key) {
        const details = document.getElementById(`details-${key}`);
        const indicator = document.getElementById(`toggle-ind-${key}`);
        if (details.style.display === "none" || !details.style.display) {
            details.style.display = "block";
            indicator.innerHTML = "▴";
        } else {
            details.style.display = "none";
            indicator.innerHTML = "▾";
        }
    }

    function pedirToken() {
        const userToken = prompt("🔒 ACCESO RESTRINGIDO // GOXION ADMIN\n\nIngresa tu Personal Access Token:");
        if (userToken && userToken.trim() !== "") {
            currentToken = userToken.trim(); localStorage.setItem("GOXION_PAT", currentToken); inicializarPanel();
        } else { alert("Acceso denegado."); }
    }

    async function inicializarPanel() {
        const version = new Date().getTime();
        const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}?v=${version}`;
        try {
            const response = await fetch(url, { headers: { "Authorization": `token ${currentToken}`, "Accept": "application/vnd.github.v3+json" }, cache: "no-store" });
            if (response.status === 401) { localStorage.removeItem("GOXION_PAT"); location.reload(); return; }

            const data = await response.json();
            const contentDecoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
            const jsonCompleto = JSON.parse(contentDecoded);
            currentFileData = { sha: data.sha };

            if (jsonCompleto._goxion_config) {
                configGlobal = jsonCompleto._goxion_config;
                if (!configGlobal.serviciosGlobales) configGlobal.serviciosGlobales = DEFAULT_SERVICES;
                delete jsonCompleto._goxion_config; 
            } else {
                configGlobal.serviciosGlobales = DEFAULT_SERVICES;
                configGlobal.combo_upsell = true;
            }

            clientesDict = jsonCompleto;

            document.getElementById("combo-active").checked = configGlobal.combo_upsell !== false;
            document.getElementById("alert-active").checked = configGlobal.alertas?.activa || false;
            if(configGlobal.alertas?.falla) document.getElementById("alert-type").value = configGlobal.alertas.falla;
            document.getElementById("global-msg").value = configGlobal.alertas?.mensaje || "";
            toggleAlertFields();

            calcularInventarioYFinanzas();
            renderGlobalServicesUI();
            filtrarClientes();
            
        } catch (error) {
            document.getElementById("clients-container").innerHTML = `<p style="color: var(--neon-red); text-align:center;">⚠️ Error al cargar datos. Verifica tu conexión.</p>`;
        }
    }
    
    function agregarNuevoCliente() {
        let nombre = prompt("Nombre del nuevo cliente:");
        if(!nombre) return;
        let folioNum = Object.keys(clientesDict).length + 1;
        let folio = prompt("Folio:", "GX-2026-" + String(folioNum).padStart(4, '0'));
        if(!folio) return;
        let key = nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
        if(clientesDict[key]) { alert("⚠️ Ya existe este identificador."); return; }
        
        clientesDict[key] = { folio: folio, nombre: nombre, codigo: "1234", dia_pago: 15, estado: "pendiente", servicios: [] };
        calcularInventarioYFinanzas();
        filtrarClientes();
    }

    function calcularInventarioYFinanzas() {
        inventarioActivo = {};
        let ingresosTotales = 0; let costosTotales = 0;
        configGlobal.serviciosGlobales.forEach(s => { inventarioActivo[s.nombre] = 0; costosTotales += parseFloat(s.costo || 0) * parseInt(s.cuentas || 1); });

        Object.values(clientesDict).forEach(c => {
            if (c.estado !== 'suspendido' && c.servicios) {
                c.servicios.forEach(s => {
                    ingresosTotales += parseFloat(s.monto || 0);
                    let nombreCliente = s.nombre.toLowerCase();
                    configGlobal.serviciosGlobales.forEach(g => {
                        let keyword = g.nombre.split(' ')[0].toLowerCase();
                        if (nombreCliente.includes(keyword)) inventarioActivo[g.nombre] += 1;
                    });
                });
            }
        });

        document.getElementById("kpi-ingresos").innerText = `$${ingresosTotales.toFixed(0)}`;
        document.getElementById("kpi-costos").innerText = `$${costosTotales.toFixed(0)}`;
        document.getElementById("kpi-ganancias").innerText = `$${(ingresosTotales - costosTotales).toFixed(0)}`;
    }

    function renderGlobalServicesUI() {
        const container = document.getElementById("global-services-container");
        const alertSelect = document.getElementById("alert-platform");
        container.innerHTML = ""; alertSelect.innerHTML = `<option value="Todos los servicios">Todos los servicios</option>`;

        configGlobal.serviciosGlobales.forEach((srv, index) => {
            let cap = parseInt(srv.cuentas || 1) * parseInt(srv.limite || 0);
            let disp = srv.stock_manual !== undefined ? parseInt(srv.stock_manual) : (cap - (inventarioActivo[srv.nombre] || 0));
            let badge = disp <= 0 ? "inv-full" : (disp <= 1 ? "inv-warn" : "inv-ok");
            
            container.innerHTML += `
                <tr>
                    <td><input type="text" value="${srv.nombre}" onchange="updateGlobalService(${index}, 'nombre', this.value)" style="min-width:90px;"></td>
                    <td><input type="number" value="${srv.precio}" onchange="updateGlobalService(${index}, 'precio', this.value)"></td>
                    <td><input type="number" style="color:var(--neon-red);" value="${srv.costo || 0}" onchange="updateGlobalService(${index}, 'costo', this.value)"></td>
                    <td><input type="number" style="color:var(--neon-green);" value="${srv.cuentas || 1}" onchange="updateGlobalService(${index}, 'cuentas', this.value)"></td>
                    <td><input type="number" value="${srv.limite || 5}" onchange="updateGlobalService(${index}, 'limite', this.value)"></td>
                    <td><input type="number" placeholder="Auto" style="color:var(--neon-yellow);" value="${srv.stock_manual !== undefined ? srv.stock_manual : ''}" onchange="updateGlobalService(${index}, 'stock_manual', this.value)"></td>
                    <td><span class="inv-badge ${badge}">${disp}</span></td>
                    <td><button class="btn-icon danger" onclick="removeGlobalService(${index})">✖</button></td>
                </tr>
            `;
            alertSelect.innerHTML += `<option value="${srv.nombre}">${srv.nombre}</option>`;
        });
    }

    function updateGlobalService(index, field, value) {
        if (field === 'stock_manual') {
            if (value.trim() === "") delete configGlobal.serviciosGlobales[index].stock_manual;
            else configGlobal.serviciosGlobales[index].stock_manual = parseInt(value);
        } else {
            configGlobal.serviciosGlobales[index][field] = field === 'nombre' ? value : parseFloat(value) || 0;
        }
        calcularInventarioYFinanzas(); renderGlobalServicesUI(); if (field === 'nombre') renderizarClientes(clientesDict);
    }

    function addGlobalService() {
        configGlobal.serviciosGlobales.push({nombre: "Nuevo", precio: 0, costo: 0, cuentas: 1, limite: 5});
        calcularInventarioYFinanzas(); renderGlobalServicesUI();
    }
    
    function removeGlobalService(index) {
        if(confirm("¿Eliminar?")) { configGlobal.serviciosGlobales.splice(index, 1); calcularInventarioYFinanzas(); renderGlobalServicesUI(); }
    }

    function toggleAlertFields() {
        const isActive = document.getElementById("alert-active").checked;
        document.getElementById("alert-settings").style.opacity = isActive ? "1" : "0.5";
        document.getElementById("alert-settings").style.pointerEvents = isActive ? "auto" : "none";
    }
    function toggleComboUpsell() { configGlobal.combo_upsell = document.getElementById("combo-active").checked; }

    function filtrarClientes() {
        const query = document.getElementById("search-input").value.toLowerCase();
        const sortBy = document.getElementById("sort-by").value;

        let arr = Object.keys(clientesDict).map(k => ({ key: k, ...clientesDict[k] }));

        arr = arr.filter(c => {
            const matchText = c.nombre.toLowerCase().includes(query) || c.folio.toLowerCase().includes(query);
            const matchStatus = currentStatusFilter === 'all' ? true : (currentStatusFilter === 'revision' ? c.pago_en_revision === true : c.estado === currentStatusFilter);
            return matchText && matchStatus;
        });

        if (sortBy === 'name') arr.sort((a, b) => a.nombre.localeCompare(b.nombre));
        else if (sortBy === 'date') arr.sort((a, b) => (a.dia_pago || 15) - (b.dia_pago || 15));
        else arr.sort((a, b) => (b.pagos_puntuales || 0) - (a.pagos_puntuales || 0));

        const dict = {}; arr.forEach(c => { const { key, ...rest } = c; dict[key] = rest; });
        renderizarClientes(dict);
    }

    function renderizarClientes(diccionario) {
        const container = document.getElementById("clients-container");
        container.innerHTML = "";
        const keys = Object.keys(diccionario);

        if (keys.length === 0) { container.innerHTML = `<p style="text-align: center;">No hay resultados.</p>`; return; }

        const globalOptions = configGlobal.serviciosGlobales.map(s => `<option value="${s.nombre}|${s.precio}">${s.nombre} ($${s.precio})</option>`).join("");

        keys.forEach(key => {
            const cliente = diccionario[key];
            let subtotal = 0; let sHTML = "";
            
            if(cliente.servicios) {
                cliente.servicios.forEach((s, idx) => {
                    subtotal += s.monto;
                    sHTML += `
                        <div class="client-service-tag">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <strong>${s.nombre}</strong>
                                <div><strong style="color:var(--neon-blue); margin-right:8px;">$${s.monto}</strong>
                                <button class="btn-icon danger" onclick="removeClientService('${key}', ${idx})">✖</button></div>
                            </div>
                            <div class="cred-inputs">
                                <input type="text" placeholder="Correo" value="${s.correo_login || ''}" onchange="updateServiceCreds('${key}', ${idx}, 'correo_login', this.value)">
                                <div class="cred-inputs-row">
                                    <input type="text" placeholder="Perfil" value="${s.perfil_nombre || ''}" onchange="updateServiceCreds('${key}', ${idx}, 'perfil_nombre', this.value)">
                                    <input type="text" placeholder="PIN" value="${s.perfil_pin || ''}" onchange="updateServiceCreds('${key}', ${idx}, 'perfil_pin', this.value)">
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            let enRev = cliente.pago_en_revision === true;
            let sColor = enRev ? 'var(--neon-purple)' : (cliente.estado === 'pagado' ? 'var(--neon-green)' : (cliente.estado === 'suspendido' ? 'var(--neon-red)' : 'var(--neon-blue)'));
            let sBadge = enRev ? 'EN REVISIÓN 🔔' : (cliente.estado === 'pagado' ? 'PAGADO' : (cliente.estado === 'suspendido' ? 'SUSPENDIDO' : 'PENDIENTE'));
            let pulse = enRev ? 'animation: pulse 1.5s infinite;' : '';

            let linkPago = `https://henrygonzalezestrada-cyber.github.io/goxion/index.html?cliente=${key}`;
            let waText = enRev ? `Hola ${cliente.nombre}, estoy revisando tu comprobante de pago de Goxion.` : (cliente.estado === 'pendiente' ? `Hola ${cliente.nombre}, te recuerdo que tu pago de Goxion por $${subtotal} está próximo a vencer. Estado de cuenta: ${linkPago}` : `Hola ${cliente.nombre}, te comparto tu estado de cuenta: ${linkPago}`);
            let waUrl = `https://wa.me/?text=${encodeURIComponent(waText)}`;

            const card = document.createElement("div");
            card.className = "client-card";
            card.style.borderLeftColor = sColor;
            
            card.innerHTML = `
                <div class="card-header-main" onclick="toggleClientDetails('${key}')">
                    <div style="flex:1;">
                        <h3 style="color: ${sColor}; line-height: 1.1;">[${cliente.folio}]<br><span style="color:#fff; font-size:1.1rem;">${cliente.nombre}</span></h3>
                        <div style="margin-top: 6px;"><span class="client-status-badge" style="color:${sColor}; border-color:${sColor}40; background:${sColor}10; ${pulse}">${sBadge}</span></div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size:1.3rem; font-weight:bold;">$${subtotal}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">Día: ${cliente.dia_pago || 15} <span id="toggle-ind-${key}" style="font-size:1.2rem; vertical-align:middle; margin-left:4px;">▾</span></div>
                    </div>
                </div>

                <!-- 1-TAP QUICK ACTIONS -->
                <div class="quick-actions-bar" onclick="event.stopPropagation()">
                    <button class="quick-btn qb-link" onclick="copiarInfo('${cliente.nombre}', '${key}')">🔗 Link</button>
                    <a class="quick-btn qb-wa" href="${waUrl}" target="_blank">💬 Mensaje</a>
                    ${enRev ? `<button class="quick-btn qb-approve" onclick="aprobarPago('${key}', ${subtotal})">✅ Validar</button>` : ''}
                </div>

                <div class="client-details" id="details-${key}">
                    <!-- EDICIÓN DE NOMBRE Y PIN (APP) -->
                    <div style="display:flex; gap: 10px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed rgba(255,255,255,0.1);">
                        <div style="flex: 2;">
                            <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Nombre del Cliente</label>
                            <input type="text" value="${cliente.nombre}" style="width: 100%; background:#12121a; color:#fff; border: 1px solid rgba(255,255,255,0.2); border-radius:8px; padding:10px; outline:none;" onchange="updateClientData('${key}', 'nombre', this.value)">
                        </div>
                        <div style="flex: 1;">
                            <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px;">PIN Acceso (App)</label>
                            <input type="text" value="${cliente.codigo || '1234'}" style="width: 100%; background:#12121a; color:var(--neon-green); border: 1px solid rgba(0,255,157,0.3); border-radius:8px; padding:10px; outline:none; font-weight:bold; text-align:center;" onchange="updateClientData('${key}', 'codigo', this.value)">
                        </div>
                    </div>

                    <div style="display:flex; gap: 10px; margin-bottom: 15px;">
                        <div style="flex: 1;">
                            <label style="font-size: 0.75rem; color: var(--text-muted); display: block;">Día Cobro</label>
                            <input type="number" value="${cliente.dia_pago || 15}" style="width:100%; background:#12121a; color:#fff; border:1px solid rgba(255,255,255,0.2); border-radius:8px; padding:10px;" onchange="updateClientData('${key}', 'dia_pago', this.value)">
                        </div>
                        <div style="flex: 2;">
                            <label style="font-size: 0.75rem; color: var(--text-muted); display: block;">Estado</label>
                            <select class="status-select status-${cliente.estado}" style="width:100%;" onchange="updateClientData('${key}', 'estado', this.value)">
                                <option value="pendiente" ${cliente.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                                <option value="pagado" ${cliente.estado === 'pagado' ? 'selected' : ''}>Pagado</option>
                                <option value="suspendido" ${cliente.estado === 'suspendido' ? 'selected' : ''}>Suspendido</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="client-services-list">
                        ${sHTML}
                        <div style="display:flex; gap:8px; margin-top:10px;">
                            <select id="add-srv-sel-${key}" style="flex:1; background:#12121a; color:#fff; border:1px solid var(--neon-blue); border-radius:8px; padding:10px;">${globalOptions}</select>
                            <button class="btn-save" style="padding:10px 15px;" onclick="addClientService('${key}')">➕</button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function aprobarPago(key, monto) {
        if(!confirm("¿Confirmas el pago?")) return;
        let cli = clientesDict[key];
        cli.estado = "pagado"; cli.pago_en_revision = false; cli.pagos_puntuales = (cli.pagos_puntuales || 0) + 1;
        calcularInventarioYFinanzas(); filtrarClientes();
    }

    function updateClientData(key, field, value) {
        if (field === 'dia_pago') value = parseInt(value) || 15;
        clientesDict[key][field] = value;
        calcularInventarioYFinanzas(); filtrarClientes();
    }

    function updateServiceCreds(key, idx, field, value) { clientesDict[key].servicios[idx][field] = value.trim(); }

    function addClientService(key) {
        const [n, p] = document.getElementById(`add-srv-sel-${key}`).value.split('|');
        if (!clientesDict[key].servicios) clientesDict[key].servicios = [];
        clientesDict[key].servicios.push({ nombre: n, monto: parseFloat(p), correo_login: "", perfil_nombre: "", perfil_pin: "" });
        calcularInventarioYFinanzas(); renderGlobalServicesUI(); filtrarClientes();
    }
    function removeClientService(key, idx) { clientesDict[key].servicios.splice(idx, 1); calcularInventarioYFinanzas(); renderGlobalServicesUI(); filtrarClientes(); }

    function copiarInfo(nombre, key) {
        const link = `https://henrygonzalezestrada-cyber.github.io/goxion/index.html?cliente=${key}`;
        navigator.clipboard.writeText(`Hola ${nombre}, tu estado de cuenta: ${link}`);
        alert("¡Copiado!");
    }

    async function prepararYGuardar() {
        if (!currentFileData) return;
        const btn = document.getElementById('btn-save-mobile');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<i>⏳</i><span>Guardando</span>`;

        configGlobal.alertas = { activa: document.getElementById("alert-active").checked, plataforma: document.getElementById("alert-platform").value, falla: document.getElementById("alert-type").value, mensaje: document.getElementById("global-msg").value };
        configGlobal.combo_upsell = document.getElementById("combo-active").checked;

        const payload = {
            message: "🤖 Admin Mobile Update: Quick Actions & PIN Edit",
            content: btoa(unescape(encodeURIComponent(JSON.stringify({ _goxion_config: configGlobal, ...clientesDict }, null, 2)))),
            sha: currentFileData.sha, branch: CONFIG.branch
        };

        try {
            const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}`, {
                method: "PUT", headers: { "Authorization": `token ${currentToken}`, "Content-Type": "application/json" }, body: JSON.stringify(payload)
            });
            if (response.ok) { currentFileData.sha = (await response.json()).content.sha; alert("¡GUARDADO!"); } 
            else alert("Error al guardar.");
        } catch (e) { console.error(e); }
        btn.innerHTML = originalHTML;
    }
    
    function aplicarMisionesMasivas() {} // Se mantiene el shell para no romper el html si se expande a futuro
    function borrarMisionesMasivas() {}
    </script>
</body>
</html>
