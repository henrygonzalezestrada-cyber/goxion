<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOXION // Resumen de Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #030305;
      --card-bg: #0a0a0f;
      --neon-green: #00ff9d;
      --neon-purple: #bc13fe;
      --neon-red: #ff003c;
      --neon-blue: #00f2fe;
      --neon-yellow: #f8e800;
      --text-main: #ffffff;
      --text-muted: #8892b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
    
    body { 
        background-color: var(--bg-color); 
        color: var(--text-main); 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        padding: 20px; 
        background-image: radial-gradient(circle at 50% 0%, rgba(188, 19, 254, 0.05) 0%, transparent 50%);
    }

    .container { 
        width: 100%; 
        max-width: 420px; 
        background: linear-gradient(145deg, #12121a, #08080c);
        border: 1px solid rgba(188, 19, 254, 0.2); 
        border-radius: 12px; 
        padding: 25px; 
        box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
        position: relative;
        overflow: hidden;
    }

    /* Borde superior dinámico */
    .top-glow {
        position: absolute;
        top: 0; left: 0; right: 0; height: 3px;
        background: var(--neon-blue);
        box-shadow: 0 0 15px var(--neon-blue);
    }
    
    /* --- HEADER --- */
    .header { text-align: center; margin-bottom: 25px; }
    .logo-text { font-size: 1.8rem; font-weight: 700; color: var(--text-main); letter-spacing: 3px; text-shadow: 0 0 10px rgba(188, 19, 254, 0.5); margin-bottom: 2px; }
    .subtitle { color: var(--text-muted); font-size: 0.95rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

    /* --- BALANCE PRINCIPAL (5 Seconds Rule) --- */
    .balance-section { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); }
    .balance-label { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 1px; margin-bottom: 4px; }
    .balance-amount { font-size: 3.5rem; font-weight: 700; line-height: 1; margin-bottom: 8px; transition: 0.3s; }
    .balance-date { font-size: 1.05rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); }
    
    /* --- CLIENTE INFO --- */
    .client-identity { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 12px 15px; background: rgba(255,255,255,0.02); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
    .client-identity div { display: flex; flex-direction: column; }
    .identity-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .identity-value { font-size: 1rem; font-weight: 700; color: var(--text-main); }

    /* --- SERVICIOS ACTIVOS --- */
    .section-title { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; color: var(--neon-purple); margin-bottom: 12px; font-weight: 700; border-left: 3px solid var(--neon-purple); padding-left: 8px; }
    .service-list { margin-bottom: 20px; }
    .service-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.05); font-size: 1.05rem; }
    .service-item:last-child { border-bottom: none; }
    .service-name { font-weight: 600; color: var(--text-main); }
    .service-price { font-weight: 700; color: var(--text-muted); }

    /* --- DESGLOSE --- */
    .breakdown-box { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 15px; margin-bottom: 20px; font-size: 0.95rem; border: 1px solid rgba(255,255,255,0.05); }
    .breakdown-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
    .breakdown-line:last-child { margin-bottom: 0; }
    .line-discount { color: var(--neon-green); }
    .line-fee { color: var(--neon-red); }

    /* --- MENSAJES Y ALERTAS --- */
    .alert-box { border-radius: 8px; padding: 12px; font-size: 0.9rem; font-weight: 600; line-height: 1.4; margin-bottom: 20px; text-align: center; border: 1px solid; }
    .alert-overdue { background: rgba(255, 0, 60, 0.1); border-color: rgba(255, 0, 60, 0.3); color: var(--neon-red); }
    .alert-suspended { background: rgba(255, 0, 60, 0.15); border-color: var(--neon-red); color: var(--neon-red); font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(255, 0, 60, 0.2); }
    
    /* --- PROGRAMA LEALTAD --- */
    .loyalty-box { background: #12121a; border-radius: 8px; padding: 15px; border: 1px solid rgba(0, 255, 157, 0.2); margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
    .loyalty-icon { font-size: 1.8rem; line-height: 1; color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 157, 0.4); }
    .loyalty-content { flex: 1; }
    .loyalty-title { font-size: 0.85rem; color: var(--neon-green); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .loyalty-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.3; }
    .loyalty-highlight { color: var(--text-main); font-weight: 700; }

    /* --- BOTONES --- */
    .actions-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .btn { width: 100%; padding: 12px; border-radius: 6px; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border: none; outline: none; text-transform: uppercase; letter-spacing: 1px; }
    .btn:active { transform: translateY(2px); }
    
    .btn-primary { background: linear-gradient(135deg, var(--neon-green), #00cc7d); color: #000; }
    .btn-primary:hover { box-shadow: 0 0 15px rgba(0, 255, 157, 0.4); }

    .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.2); }
    .btn-secondary:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }

    .btn-paid { background: rgba(0, 255, 157, 0.05); color: var(--neon-green); border: 1px dashed var(--neon-green); cursor: default; }
    .btn-paid:active { transform: none; }

    .footer { text-align: center; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--neon-purple); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 0.95rem; font-weight: 700; display: none; box-shadow: 0 0 15px rgba(188, 19, 254, 0.5); z-index: 1000; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes pulse-dot { 0% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.6); } 70% { box-shadow: 0 0 0 6px rgba(0, 242, 254, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); } }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>

<div class="container" id="app">
  <div style="text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 1.1rem; font-weight: 600;">
    Sincronizando con Goxion...
  </div>
</div>

<div class="toast" id="toast">📋 ¡Datos copiados al portapapeles!</div>

<script>
  const TELEFONO_GOXION = "528136836901"; 
  const CLABE_PAGO = "638180000167909381";
  const BANCO_PAGO = "NU BANCO";
  const TITULAR_PAGO = "Henry González";

  async function cargarEstadoCuenta() {
    const params = new URLSearchParams(window.location.search);
    const clienteKey = params.get('cliente')?.toLowerCase().trim();
    const app = document.getElementById('app');

    if (!clienteKey) {
      app.innerHTML = `<div style="text-align:center; color: var(--neon-red); font-weight:700;">⚠️ ENLACE INCOMPLETO. FALTAN DATOS DEL CLIENTE.</div>`;
      return;
    }

    try {
      const response = await fetch('clientes.json', { cache: 'no-store' });
      if (!response.ok) throw new Error("No se pudo conectar");
      
      const data = await response.json();
      const cliente = data[clienteKey];

      if (!cliente) {
        app.innerHTML = `<div style="text-align:center; color: var(--neon-red); font-weight:700;">❌ EL CLIENTE "${clienteKey}" NO EXISTE EN LA BASE DE DATOS.</div>`;
        return;
      }

      // 1. Fechas y Periodo
      const hoy = new Date();
      const diaHoy = hoy.getDate();
      const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      const mesActual = meses[hoy.getMonth()];
      
      const diaPago = cliente.dia_pago || 15;
      const difDias = diaPago - diaHoy; 
      
      let rachaOriginal = cliente.pagos_puntuales || 0;
      let racha = rachaOriginal;
      let perdioRacha = false;

      if (cliente.estado !== 'pagado' && difDias < 0 && rachaOriginal > 0) {
          racha = 0;
          perdioRacha = true;
      }

      // 2. Subtotal de Servicios
      let subtotal = 0;
      let serviciosHTML = '';
      if (cliente.servicios && cliente.servicios.length > 0) {
        cliente.servicios.forEach(s => {
          subtotal += s.monto;
          serviciosHTML += `
            <div class="service-item">
              <span class="service-name">${s.nombre}</span>
              <span class="service-price">$${s.monto}</span>
            </div>
          `;
        });
      }

      // 3. Variables de Estado Visual (La regla de 5 segundos)
      let uiColor = "var(--neon-blue)";
      let shadowColor = "rgba(0, 242, 254, 0.4)";
      let dateText = `${diaPago} de ${mesActual}`;
      let statusDotColor = "var(--neon-blue)";
      
      let pctMoraDiaria = 0, montoMora = 0, montoBajaAdmin = 0, diasAtraso = 0;
      let alertaHTML = "";

      if (cliente.estado === 'pagado') {
          uiColor = "var(--neon-green)";
          shadowColor = "rgba(0, 255, 157, 0.4)";
          statusDotColor = "var(--neon-green)";
          dateText = `Al corriente este mes`;
      } else if (cliente.estado === 'suspendido') {
          uiColor = "var(--neon-red)";
          shadowColor = "rgba(255, 0, 60, 0.4)";
          statusDotColor = "var(--neon-red)";
          dateText = `Servicio Suspendido`;
          alertaHTML = `<div class="alert-box alert-suspended">⛔ CUENTA SUSPENDIDA</div>`;
          diasAtraso = Math.abs(difDias); // Asumimos cálculo de mora si sigue suspendido
      } else if (difDias < 0) {
          uiColor = "var(--neon-red)";
          shadowColor = "rgba(255, 0, 60, 0.4)";
          statusDotColor = "var(--neon-red)";
          diasAtraso = Math.abs(difDias);
          dateText = `Vencido hace ${diasAtraso} día(s)`;
      } else if (difDias === 0) {
          uiColor = "var(--neon-yellow)";
          shadowColor = "rgba(248, 232, 0, 0.4)";
          statusDotColor = "var(--neon-yellow)";
          dateText = `Vence HOY`;
      } else {
          // Pendiente normal
          dateText = `Vence el ${diaPago} de ${mesActual}`;
      }

      // Lógica de Mora
      if (cliente.estado !== 'pagado' && diasAtraso > 0) {
          let pctMoraCalculado = diasAtraso * 0.05;
          pctMoraDiaria = Math.min(pctMoraCalculado, 0.50);
          montoMora = Math.round(subtotal * pctMoraDiaria);
          let acumMoraTotal = subtotal + montoMora;

          if (diasAtraso > 15 || cliente.estado === 'suspendido') {
              montoBajaAdmin = Math.round(acumMoraTotal * 0.20);
          }

          if (cliente.estado !== 'suspendido') {
              alertaHTML = `
                <div class="alert-box alert-overdue">
                  ⚠️ <strong>Pago Atrasado.</strong><br>
                  Se aplica recargo automático del 5% diario (+${Math.round(pctMoraDiaria * 100)}% acum.).
                  ${diasAtraso > 15 ? `<br><span style="color:var(--text-main);">Se sumó cargo de reactivación.</span>` : ''}
                </div>
              `;
          }
      }

      // 4. Fidelidad
      let pctDescuento = 0;
      let mensajeLealtad = '';

      if (racha >= 9) {
        pctDescuento = 0.06;
        mensajeLealtad = `Nivel 2 activo: <span class="loyalty-highlight">6% de descuento</span> aplicado.`;
      } else if (racha >= 4) {
        pctDescuento = 0.03;
        mensajeLealtad = `Nivel 1 activo: <span class="loyalty-highlight">3% OFF</span>. Faltan ${9 - racha} pagos para Nivel 2.`;
      } else {
        pctDescuento = 0;
        mensajeLealtad = perdioRacha 
          ? `<span style="color:var(--neon-red);">💔 Racha reiniciada por atraso.</span>` 
          : `Progreso: <span class="loyalty-highlight">${racha}/4 pagos</span> para Nivel 1.`;
      }

      // 5. Totales
      let ahorro = (diasAtraso === 0 && cliente.estado !== 'suspendido') ? Math.round(subtotal * pctDescuento) : 0;
      let totalFinal = (subtotal - ahorro) + montoMora + montoBajaAdmin;
      
      let labelTotal = "Total a Pagar";
      let btnAccionHTML = `<button class="btn btn-primary" onclick="copiarDatos('${totalFinal}')">Copiar Datos de Pago</button>`;
      
      if (cliente.estado === 'pagado') {
          totalFinal = 0;
          labelTotal = "Saldo Pendiente";
          btnAccionHTML = `<button class="btn btn-paid" onclick="return false;">✅ MENSUALIDAD PAGADA</button>`;
      }

      // Desglose si hay cambios
      let breakdownHTML = '';
      if (cliente.estado !== 'pagado' && (ahorro > 0 || montoMora > 0 || montoBajaAdmin > 0)) {
          breakdownHTML = `
            <div class="breakdown-box">
              <div class="breakdown-line" style="color: var(--text-muted);"><span>Subtotal Mensual</span><span>$${subtotal}</span></div>
              ${ahorro > 0 ? `<div class="breakdown-line line-discount"><span>Descuento Lealtad</span><span>-$${ahorro}</span></div>` : ''}
              ${montoMora > 0 ? `<div class="breakdown-line line-fee"><span>Recargo Mora</span><span>+$${montoMora}</span></div>` : ''}
              ${montoBajaAdmin > 0 ? `<div class="breakdown-line line-fee"><span>Reactivación</span><span>+$${montoBajaAdmin}</span></div>` : ''}
            </div>
          `;
      }

      const mensajeWA = encodeURIComponent(`Hola GOXION, requiero asistencia con mi cuenta.\n👤 Cliente: ${cliente.nombre}\n📄 Folio: ${cliente.folio}`);
      const urlWA = `https://wa.me/${TELEFONO_GOXION}?text=${mensajeWA}`;

      // Inyección de UI
      app.innerHTML = `
        <div class="top-glow" style="background: ${uiColor}; box-shadow: 0 0 15px ${shadowColor};"></div>
        
        <div class="header">
          <div class="logo-text">GOXION</div>
          <div class="subtitle">Resumen de Cuenta</div>
        </div>

        <div class="balance-section">
          <div class="balance-label">${labelTotal}</div>
          <div class="balance-amount" style="color: ${uiColor}; text-shadow: 0 0 15px ${shadowColor};">
            $${totalFinal.toFixed(2)}
          </div>
          <div class="balance-date" style="color: ${uiColor}; border-color: ${uiColor}40;">
            <div class="status-dot" style="background: ${statusDotColor}; box-shadow: 0 0 0 0 ${statusDotColor}80; animation: pulse-dot 1.5s infinite;"></div>
            ${dateText}
          </div>
        </div>

        ${alertaHTML}

        <div class="client-identity">
            <div>
                <span class="identity-label">Cliente</span>
                <span class="identity-value">${cliente.nombre}</span>
            </div>
            <div style="text-align: right;">
                <span class="identity-label">Folio</span>
                <span class="identity-value" style="color: var(--neon-purple);">${cliente.folio}</span>
            </div>
        </div>

        <div class="section-title">Servicios Activos</div>
        <div class="service-list">
          ${serviciosHTML}
        </div>

        ${breakdownHTML}

        <div class="loyalty-box">
          <div class="loyalty-icon">⭐</div>
          <div class="loyalty-content">
            <div class="loyalty-title">Programa Goxion</div>
            <div class="loyalty-desc">${mensajeLealtad}</div>
          </div>
        </div>

        <div class="actions-group">
          ${btnAccionHTML}
          <a href="${urlWA}" target="_blank" class="btn btn-secondary">Contactar Soporte</a>
        </div>

        <div class="footer">
          Conectando tu entretenimiento.<br>
          <span style="color: var(--neon-purple);">Goxion © ${hoy.getFullYear()}</span>
        </div>
      `;

    } catch (e) {
      app.innerHTML = `<div style="text-align:center; color: var(--neon-red); font-weight:700;">⚠️ ERROR AL CARGAR EL ESTADO DE CUENTA.</div>`;
    }
  }

  function copiarDatos(monto) {
    const texto = `GOXION - Datos de Transferencia\n\nBanco: ${BANCO_PAGO}\nTitular: ${TITULAR_PAGO}\nCLABE: ${CLABE_PAGO}\nMonto exacto: $${monto} MXN`;
    navigator.clipboard.writeText(texto).then(() => {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    });
  }

  cargarEstadoCuenta();
</script>

</body>
</html>
