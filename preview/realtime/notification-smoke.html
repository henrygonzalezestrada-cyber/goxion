<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="../../">
<title>GOXION · Smoke Realtime (datos simulados)</title>
<link rel="stylesheet" href="./assets/css/realtime-client-notifications.css">
<style>
:root{--card-glass:rgba(8,8,12,.72);--neon-blue:#00f2fe;--text-muted:#95a4bd}
html,body{background:#030305;color:#fff;font-family:system-ui,sans-serif;min-height:180vh;margin:0}
.app-header{display:flex;justify-content:flex-end;align-items:center;padding:15px}
#header-action-btn{height:42px;background:#11182a;color:#fff;border:0;border-radius:20px;padding:0 12px}
.smoke-main{min-height:1200px;padding:20px}
</style>
</head>
<body>
<header class="app-header">
<button id="header-action-btn" type="button"><span id="header-btn-text">Iniciar sesión</span></button>
</header>
<main class="smoke-main">Escenario automatizado sin credenciales reales.</main>
<script src="./assets/js/core/runtime.js"></script>
<script>
window.getCurrentClientKey=()=>localStorage.getItem("gx-smoke-client")||"";
window.renderDashboard=()=>{window.__smokeRenderCount=(window.__smokeRenderCount||0)+1};
window.cerrarSesion=()=>{
  localStorage.removeItem(window.GOXION_CORE.STORAGE.CLIENT_TOKEN);
  localStorage.removeItem("gx-smoke-client");
};
</script>
<script src="./assets/js/ayuda/04-client-notifications-realtime.js"></script>
</body>
</html>
