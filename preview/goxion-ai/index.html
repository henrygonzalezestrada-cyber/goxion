<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030305">
<title>GOXION · Beta mascota de soporte</title>
<style>
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#030305}
iframe{display:block;width:100%;height:100%;border:0;background:#030305}
#gxai-load{position:fixed;inset:0;display:grid;place-items:center;background:#030305;color:#95a4bd;font:500 14px Poppins,system-ui,sans-serif;transition:opacity .25s;pointer-events:none}
</style>
</head>
<body>
<iframe id="gxai-app" src="../../ayuda.html" title="GOXION · Beta de Soporte" allow="clipboard-write"></iframe>
<div id="gxai-load" role="status">Abriendo GOXION…</div>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('gxai-app');
  const splash = document.getElementById('gxai-load');
  frame.addEventListener('load', () => {
    try {
      const doc = frame.contentDocument, win = frame.contentWindow;
      if (!doc || !win || new URL(win.location.href).origin !== location.origin) throw Error('Se requiere el mismo origen.');
      const css = doc.createElement('link');
      css.rel = 'stylesheet'; css.href = new URL('./mascota.css', location.href).href;
      doc.head.appendChild(css);
      const js = doc.createElement('script');
      js.src = new URL('./mascota.js', location.href).href;
      js.onload = () => {
        try { win.switchTab?.('soporte'); } catch (_) {}
        splash.style.opacity = '0';
      };
      js.onerror = () => { splash.textContent = 'No se pudo abrir la beta. Actualiza la página.'; };
      doc.body.appendChild(js);
    } catch (_) {
      splash.textContent = 'Esta beta debe abrirse desde el mismo dominio de GOXION.';
    }
  });
})();
</script>
</body>
</html>
