<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030305">
<title>GOXION · Goxy · Beta F8</title>
<style>
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#030305}
iframe{display:block;width:100%;height:100%;border:0;background:#030305}
#gxai-load{position:fixed;inset:0;display:grid;place-items:center;background:#030305;color:#95a4bd;font:500 14px Poppins,system-ui,sans-serif;transition:opacity .25s;pointer-events:none}
</style>
</head>
<body>
<iframe id="gxai-app" src="../../ayuda.html" title="GOXION · Beta de Soporte" allow="clipboard-write"></iframe>
<div id="gxai-load" role="status">Abriendo GOXION…</div>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('gxai-app');
  const splash = document.getElementById('gxai-load');
  frame.addEventListener('load', () => {
    try {
      const doc = frame.contentDocument, win = frame.contentWindow;
      if (!doc || !win || new URL(win.location.href).origin !== location.origin) throw Error('Se requiere el mismo origen.');
      const css = doc.createElement('link');
      css.rel = 'stylesheet'; css.href = new URL('./mascota.css?v=goxy-f8', location.href).href;
      doc.head.appendChild(css);
      // Cargar primero el paquete autohospedado con el renderizador original.
      const canvas = doc.createElement('script');
      canvas.src = new URL('./goxy-heads.bundle.js?v=goxy-f3', location.href).href;
      canvas.onload = () => {
        // Reusar las guías oficiales YA cargadas por Ayuda. No hay copia ni API.
        const knowledge = doc.createElement('script');
        knowledge.src = new URL('./goxy-support-knowledge.js?v=goxy-f7-2', location.href).href;
        knowledge.onload = () => {
          // Lectura mínima del estado de Mi Espacio: solo nombres, sin credenciales.
          const context = doc.createElement('script');
          context.src = new URL('./goxy-client-context.js?v=goxy-f7-2', location.href).href;
          context.onload = () => {
            const ai = doc.createElement('script');
            ai.src = new URL('./goxy-ai-client.js?v=goxy-f7', location.href).href;
            ai.onload = () => {
              const js = doc.createElement('script');
              js.src = new URL('./mascota.js?v=goxy-f8', location.href).href;
              js.onload = () => {
                try { win.switchTab?.('soporte'); } catch (_) {}
                splash.style.opacity = '0';
              };
              js.onerror = () => { splash.textContent = 'No fue posible iniciar Goxy. Actualiza la página.'; };
              doc.body.appendChild(js);
            };
            ai.onerror = () => { splash.textContent = 'No fue posible cargar el módulo seguro de Goxy.'; };
            doc.body.appendChild(ai);
          };
          context.onerror = () => { splash.textContent = 'No se pudo cargar el contexto de los servicios.'; };
          doc.body.appendChild(context);
        };
        knowledge.onerror = () => { splash.textContent = 'No se pudo cargar el catálogo de soporte.'; };
        doc.body.appendChild(knowledge);
      };
      canvas.onerror = () => { splash.textContent = 'No se pudo cargar el motor animado de Goxy.'; };
      doc.body.appendChild(canvas);
    } catch (_) {
      splash.textContent = 'Esta beta debe abrirse desde el mismo dominio de GOXION.';
    }
  });
})();
</script>
</body>
</html>
