<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030305">
<title>GOXION · Prórroga automática · Beta de Mi Espacio</title>
<base href="../../">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/ayuda.css">
<link rel="stylesheet" href="./preview/ayuda-prorroga/prorroga-auto.css?v=auto2">
<style>
html,body{min-height:100%;background:#030407!important;color:#f6f7ff}
body{margin:0;overflow-x:hidden!important}
.gx-pr-demo-shell{width:min(580px,100%);margin:0 auto;min-height:100dvh;padding:26px 18px 90px;
box-sizing:border-box;position:relative}
.gx-pr-demo-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.gx-pr-demo-top img{width:112px;height:auto;object-fit:contain}
.gx-pr-demo-top span{font-size:10px;letter-spacing:1px;color:#9bb0cf;font-weight:700}
.gx-pr-demo-head{text-align:center;margin:0 0 25px}
.gx-pr-demo-head h1{font-size:24px;letter-spacing:-.5px;font-weight:700;margin:0 0 9px}
 #dash-billing-card{padding:26px 22px 23px!important;margin:0 0 30px;background:rgba(13,16,31,.7)!important;
 border:1px solid rgba(133,158,200,.14)!important;border-radius:24px!important}
#dash-date{margin:12px 0 4px;text-align:center;font-weight:700;font-size:29px;letter-spacing:-.5px}
#dash-badge{text-align:center;margin-bottom:18px}
#dash-badge>span{color:#a9e2ef;font-size:11px}
.gx-pr-demo-date-label{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:#a9bad0}
.gx-pr-demo-badge{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
font:600 9px Poppins,sans-serif;white-space:nowrap;max-width:calc(100vw - 22px);
letter-spacing:.4px;background:rgba(6,11,20,.92);border:1px solid rgba(124,151,188,.3);
border-radius:20px;padding:9px 14px;color:#bad1e6;backdrop-filter:blur(14px);z-index:4}
 .gx-account-capsule{width:100%;max-width:none!important;margin:21px 0 0!important;min-height:48px!important}
</style>
</head>
<body>
<div class="gx-pr-demo-shell">
<div class="gx-pr-demo-top"><img src="logo2.PNG" alt="GOXION"><span>MI ESPACIO</span></div>
<div class="gx-pr-demo-head"><h1>Tu espacio, a tu ritmo.</h1></div>
<div id="dash-billing-card" class="glass-card dash-card">
<div id="dash-date-label" class="gx-pr-demo-date-label">Tu próxima fecha de pago</div>
<div id="dash-date">15 de octubre</div>
<div id="dash-badge"><span>Tu pago vence hoy</span></div>
<button class="gx-account-capsule" type="button" onclick="alert('Estado de cuenta simulado · No hay pagos reales.')">
<span class="gx-account-capsule-label">Ver Estado de Cuenta</span>
<span class="gx-account-capsule-arrow">↗</span></button>
</div>
</div>
<div class="gx-pr-demo-badge">GOXION BETA · SIMULACIÓN SIN COBROS REALES</div>
<script src="./preview/ayuda-prorroga/prorroga-auto.js?v=auto2"></script>
</body>
</html>
