let operations=[{id:'o1',client:'c1',kind:'payment',title:'Un pago por revisar',description:'Mariana Torres · comprobante de $349',time:'Hace 8 min',done:false},{id:'o2',client:'c2',kind:'cancel',title:'Cancelación por hacer efectiva',description:'Andrés Molina · Spotify',time:'Hace 24 min',done:false},{id:'o3',client:'c3',kind:'support',title:'Una conversación pendiente',description:'Sofía Ramírez · consulta de su cuenta',time:'Hace 42 min',done:false}];
let notices=[{client:'c1',text:'Mariana envió un comprobante',sub:'Pago de $349 · hace 8 min',read:false},{client:'c2',text:'Cancelación lista para revisión',sub:'Andrés Molina · Spotify',read:false}];
let events=[{text:'Daniel tiene su cuenta al corriente',time:'Hace 18 min'},{text:'Valentina se incorporó a GOXION',time:'Hace 35 min'}];
let state={page:'inicio',filter:'todos',query:'',opFilter:'pendientes',selected:null,tab:'resumen',simulated:false};
let returnFocus=null, toastTimer;
const sections=[['inicio','home','Inicio'],['clientes','users','Clientes'],['operaciones','stack','Operaciones'],['gestion','grid','Gestión']];
const statusText={review:'Pago en revisión',due:'Por vencer',late:'Pago vencido',good:'Al corriente'};
const pending=()=>operations.filter(o=>!o.done);
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4000)}
function transition(change){if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){return document.startViewTransition(change)}change();return null}
function nav(){const html=sections.map(([id,ico,label])=>`<a href="#${id}" class="nav-link ${state.page===id?'active':''}" ${state.page===id?'aria-current="page"':''}>${icon(ico)}<span>${label}</span>${id==='operaciones'?`<span class="nav-count">${pending().length}</span>`:''}</a>`).join('');$('.side-nav').innerHTML=html;$('.mobile-nav').innerHTML=sections.map(([id,ico,label])=>`<a href="#${id}" class="${state.page===id?'active':''}" ${state.page===id?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></a>`).join('');$('#location').textContent=sections.find(s=>s[0]===state.page)[2];$('#notice-dot').hidden=!notices.some(n=>!n.read)}
function card(c){return `<article class="client-card" data-status="${c.status}" style="view-transition-name:card-${c.id}"><div class="client-top"><div class="avatar">${c.initials}</div><div class="identity"><h3>${c.name}</h3><small>${c.folio}</small></div></div><span class="status ${c.status}">${statusText[c.status]}</span><div class="amount">${money(c.amount)}<small>MXN</small></div><p class="client-meta">${c.status==='review'?'Comprobante recibido':c.status==='good'?'Próxima renovación':'Vencimiento'} · ${c.date}</p><div class="services">${c.services.map(s=>`<span class="service">${s}</span>`).join('')}</div><button class="card-action" data-client="${c.id}" aria-label="Abrir expediente de ${c.name}"><span>${c.status==='review'?'Revisar pago':'Ver expediente'}</span>${icon('arrow')}</button></article>`}
function op(o,full=false){return `<button class="priority-item" data-operation="${o.id}" style="view-transition-name:operation-${o.id}"><span class="item-icon ${o.kind}">${icon(o.kind==='payment'?'receipt':o.kind==='cancel'?'clock':'chat')}</span><span><span class="item-title">${o.title}</span><span class="item-sub">${o.description}<br>${o.time}</span></span>${full?`<span class="ops-tag">${o.done?'Revisado en muestra':o.kind==='payment'?'Revisión':o.kind==='cancel'?'Cancelación':'Soporte'}</span>`:''}<span class="arrow">${icon('chevron')}</span></button>`}
function intro(eyebrow,title,text,action=''){return `<div class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${text}</p></div>${action}</div>`}
function home(){const n=pending().length;return `<section class="page">${intro('Domingo, 15 de noviembre · vista de muestra','Cada cliente. En su lugar.','Tu operación, con perspectiva. Esto es lo que necesita tu atención.',`<a class="button primary" href="#operaciones">Atender pendientes ${icon('arrow')}</a>`)}<div class="stats"><div class="stat"><span>Por atender</span><strong class="urgent-count">0${n}</strong><small>${clients.filter(c=>c.status==='review').length} pago en revisión</small></div><div class="stat"><span>Próximas renovaciones</span><strong>02<i>clientes</i></strong><small>En los siguientes 2 días</small></div><div class="stat"><span>Cartera de muestra</span><strong>06<i>clientes</i></strong><small>Todo en un solo espacio</small></div></div><div class="home-grid"><section><div class="section-head"><h2>Necesitan de ti <span class="count">${n}</span></h2><a href="#operaciones">Ver todo</a></div>${n?pending().map(o=>op(o)).join(''):'<div class="check-line">'+icon('check')+'No quedan asuntos en esta muestra.</div>'}</section><aside class="home-aside"><div class="focus-note">${icon('spark')}<h3>Anticiparte también es cuidar.</h3><p>Andrés y Valentina renuevan pronto. Revisa sus cuentas antes del vencimiento.</p><button class="button" id="upcoming" aria-label="Ver próximas renovaciones"><span>Ver próximas renovaciones</span>${icon('arrow')}</button></div><section class="activity"><div class="section-head"><h3>Lo último que pasó</h3></div>${events.slice(0,2).map(e=>`<div class="activity-row"><span class="dot"></span><div><p>${e.text}</p><small>${e.time}</small></div></div>`).join('')}</section></aside></div><section class="client-section"><div class="section-head"><h2>Clientes en el radar</h2><a href="#clientes">Ver clientes ${icon('arrow')}</a></div><div class="client-grid home-clients">${clients.slice(0,3).map(card).join('')}</div></section></section>`}
function filteredClients(){const q=state.query.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return clients.filter(c=>(state.filter==='todos'||state.filter==='atencion'&&['review','late'].includes(c.status)||state.filter===c.status)&&(c.name+' '+c.folio+' '+c.services.join(' ')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q))}
function clientsPage(){return `<section class="page">${intro('Clientes','Personas, antes que cuentas.','Su estado, su próximo paso y todo lo que necesitas para atenderlas.')}<div class="toolbar"><div class="filters" aria-label="Filtrar clientes">${[['todos','Todos'],['atencion','Necesitan atención'],['due','Por vencer'],['good','Al corriente']].map(([id,label])=>`<button class="filter ${state.filter===id?'active':''}" aria-pressed="${state.filter===id}" data-filter="${id}">${label}</button>`).join('')}</div><label class="search">${icon('search')}<input id="client-search" aria-label="Buscar clientes por nombre, folio o servicio" placeholder="Nombre, folio o servicio…" autocomplete="off"></label></div><div class="client-grid" id="client-results">${filteredClients().map(card).join('')||'<div class="empty">No encontramos coincidencias.<br>Prueba con otro nombre, folio o servicio.</div>'}</div><p class="demo-notice" id="result-count" aria-live="polite">${filteredClients().length} clientes en esta vista</p></section>`}
function operationsPage(){const list=operations.filter(o=>state.opFilter==='pendientes'?!o.done:state.opFilter==='resueltos'?o.done:!o.done&&o.kind===state.opFilter);return `<section class="page">${intro('Operaciones','Una cosa a la vez.','Cada pendiente tiene contexto, una persona y un siguiente paso.')}<div class="toolbar"><div class="filters" aria-label="Filtrar operaciones">${[['pendientes','Pendientes'],['payment','Pagos'],['cancel','Cancelaciones'],['support','Soporte'],['resueltos','Revisados']].map(([id,label])=>`<button class="filter ${state.opFilter===id?'active':''}" aria-pressed="${state.opFilter===id}" data-opfilter="${id}">${label}</button>`).join('')}</div><span class="muted" style="font-size:12px">${list.length} asuntos</span></div><div class="ops-list">${list.length?list.map(o=>op(o,true)).join(''):'<div class="empty">Todo despejado en esta vista.<br>No hay asuntos para este filtro.</div>'}</div></section>`}
const management=[['catalogo','grid','Servicios y catálogo','Productos, combos y disponibilidad.'],['accesos','users','Cuentas y accesos','Asignación, perfiles y capacidad.'],['beneficios','spark','Beneficios','Cupones, referidos y lealtad.'],['registros','receipt','Solicitudes de registro','Altas de clientes y activaciones.'],['experiencia','chat','Experiencia del cliente','Incidencias, opiniones y seguimiento.'],['configuracion','stack','Configuración','Preferencias y seguridad de Admin.']];
function managementPage(){return `<section class="page">${intro('Gestión','El orden detrás de todo.','Las herramientas de tu operación, agrupadas por lo que necesitas hacer.')}<div class="manage-list">${management.map(([id,ico,title,desc])=>`<button class="manage-row" data-manage="${id}">${icon(ico)}<span><h3>${title}</h3><p>${desc}</p></span>${icon('arrow')}</button>`).join('')}</div></section>`}
function render(){nav();$('#main').innerHTML=({inicio:home,clientes:clientsPage,operaciones:operationsPage,gestion:managementPage}[state.page])();if($('#client-search'))$('#client-search').value=state.query;bind()}
function bind(){document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>openClient(b.dataset.client));document.querySelectorAll('[data-operation]').forEach(b=>b.onclick=()=>openOperation(b.dataset.operation));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;transition(render)});document.querySelectorAll('[data-opfilter]').forEach(b=>b.onclick=()=>{state.opFilter=b.dataset.opfilter;transition(render)});document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>openManage(b.dataset.manage));if($('#upcoming'))$('#upcoming').onclick=()=>{state.filter='due';location.hash='clientes'};if($('#client-search'))$('#client-search').oninput=e=>{state.query=e.target.value;$('#client-results').innerHTML=filteredClients().map(card).join('')||'<div class="empty">No encontramos coincidencias.</div>';$('#result-count').textContent=filteredClients().length+' clientes en esta vista';document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>openClient(b.dataset.client))}}
function dialog(content){if(!$('#detail').open)returnFocus=document.activeElement;$('#detail').innerHTML=`<div class="dialog-head"><span class="muted" style="font-size:11px">GOXION / ${state.selected?'Expediente':'Espacio de trabajo'}</span><button class="icon-btn" id="close-dialog" aria-label="Cerrar">${icon('close')}</button></div><div class="dialog-body">${content}</div>`;$('#close-dialog').onclick=closeDialog;if(!$('#detail').open)$('#detail').showModal()}
function closeDialog(){const d=$('#detail');const selected=state.selected;const close=()=>{d.close();d.style.viewTransitionName='';const c=selected&&document.querySelector(`[data-client="${selected}"]`)?.closest('.client-card');if(c)c.style.viewTransitionName='card-'+selected;state.selected=null};transition(close);if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true})}
$('#detail').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
function openClient(id){state.selected=id;state.tab='resumen';const source=document.querySelector(`[data-client="${id}"]`)?.closest('.client-card');transition(()=>{if(source)source.style.viewTransitionName='none';$('#detail').style.viewTransitionName='card-'+id;renderClient()})}
function renderClient(){const c=clients.find(c=>c.id===state.selected);const content=state.tab==='servicios'?c.services.map((s,i)=>`<div class="detail-row"><b>${s}</b><span>Activo · ${i&&c.id==='c1'?'22 nov':c.date}</span></div>`).join(''):state.tab==='actividad'?`<div class="activity-row"><span class="dot"></span><div><p>${c.note}</p><small>${c.time} · dato de muestra</small></div></div>`:`<div class="detail-row"><span>Próximo vencimiento</span><b>${c.date} de 2026</b></div><div class="detail-row"><span>Servicios contratados</span><b>${c.services.length} servicios</b></div><div class="detail-row"><span>Siguiente paso</span><b>${c.status==='review'?'Revisar comprobante':c.status==='late'?'Dar seguimiento al pago':c.status==='due'?'Revisar próxima renovación':'Sin pendientes de pago'}</b></div>`;const operation=operations.find(o=>o.client===c.id&&!o.done);dialog(`<div class="client-top"><span class="avatar">${c.initials}</span><span class="muted" style="font-size:12px">${c.folio}</span></div><h2 id="dialog-title">${c.name}</h2><div class="detail-summary"><div><span class="status ${c.status}" style="margin:0">${statusText[c.status]}</span><div class="amount">${money(c.amount)}<small>MXN</small></div></div><span class="muted" style="font-size:11px">${c.status==='good'?'Próxima renovación':'Importe de muestra'}</span></div><div class="detail-tabs" role="tablist" aria-label="Expediente">${[['resumen','Resumen'],['servicios','Servicios'],['actividad','Actividad']].map(([id,label])=>`<button class="detail-tab ${state.tab===id?'active':''}" role="tab" aria-selected="${state.tab===id}" data-tab="${id}">${label}</button>`).join('')}</div><div role="tabpanel">${content}</div>${operation?`<button class="button accent detail-action" id="go-operation">${operation.kind==='payment'?'Ver revisión del comprobante':'Ver asunto pendiente'}${icon('arrow')}</button>`:''}<p class="detail-note">Expediente de muestra. No representa una cuenta real.</p>`);document.querySelectorAll('[data-tab]').forEach(b=>{b.onclick=()=>{state.tab=b.dataset.tab;renderClient();document.querySelector(`[data-tab="${state.tab}"]`).focus()};b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const ids=['resumen','servicios','actividad'];state.tab=ids[(ids.indexOf(state.tab)+(e.key==='ArrowRight'?1:2))%3];renderClient();document.querySelector(`[data-tab="${state.tab}"]`).focus()}});if($('#go-operation'))$('#go-operation').onclick=()=>{closeDialog();setTimeout(()=>openOperation(operation.id),400)}}
function openOperation(id){const o=operations.find(o=>o.id===id),c=clients.find(c=>c.id===o.client);state.selected=null;dialog(`<span class="status ${o.kind==='payment'?'review':'due'}" style="margin:0">${o.done?'Revisado en muestra':'Pendiente de atención'}</span><h2 id="dialog-title">${o.title}</h2><p>${c.name} · ${c.folio}</p><div class="detail-row"><span>Asunto</span><b>${o.kind==='payment'?'Comprobante de '+money(c.amount):o.kind==='cancel'?'Cancelación de Spotify':'Consulta de cuenta'}</b></div><div class="detail-row"><span>Recibido</span><b>${o.time}</b></div><p style="margin-top:20px">${o.kind==='payment'?'Aquí se integrará la revisión oficial del comprobante, conservando sus validaciones y el motor de aprobación.':o.kind==='cancel'?'La solicitud aprobada conserva el servicio activo hasta ejecutar la cancelación efectiva mediante el flujo oficial.':'El seguimiento se vinculará a la conversación del cliente, sin crear otra bandeja de soporte.'}</p><button class="button accent detail-action" id="resolve-demo">${o.done?'Reabrir seguimiento de muestra':'Marcar revisado en esta muestra'} ${icon(o.done?'refresh':'check')}</button><p class="detail-note">Solo cambia el seguimiento del prototipo. No aprueba pagos ni cancela servicios.</p>`);$('#resolve-demo').onclick=()=>{o.done=!o.done;const done=o.done;$('#detail').close();transition(render);toast(done?'Seguimiento de muestra revisado. No se modificó ningún pago o servicio.':'Seguimiento reabierto en la muestra.');$('#main').focus({preventScroll:true})}}
function openManage(id){const m=management.find(m=>m[0]===id);state.selected=null;dialog(`<h2 id="dialog-title">${m[2]}</h2><p>${m[3]}</p><div class="detail-row"><span>Estado</span><b>Integración pendiente</b></div><p style="margin-top:20px">Este espacio reunirá las herramientas existentes de ${m[2].toLowerCase()}. Los formularios y sus validaciones se conectarán con sus controladores actuales.</p><p class="detail-note">La primera entrega permite revisar la navegación. Esta sección todavía no administra datos.</p>`)}
$('#notifications').onclick=()=>{state.selected=null;dialog(`<h2 id="dialog-title">Tu actividad</h2><p>Notificaciones de muestra, vinculadas a cada expediente.</p>${notices.map(n=>`<button class="notice-item" data-notice="${n.client}"><span class="item-icon">${icon('bell')}</span><span><strong>${n.text}</strong><small>${n.sub}</small></span></button>`).join('')}<button class="button detail-action" id="read-all">Marcar todas como leídas</button>`);document.querySelectorAll('[data-notice]').forEach(b=>b.onclick=()=>{$('#detail').close();openClient(b.dataset.notice)});$('#read-all').onclick=()=>{notices.forEach(n=>n.read=true);$('#notice-dot').hidden=true;$('#read-all').textContent='Todas leídas';$('#read-all').disabled=true;toast('Notificaciones de muestra marcadas como leídas.') }};
$('#simulate').onclick=()=>{if(state.simulated){toast('El comprobante de prueba ya llegó. Puedes revisarlo en Operaciones.');return}state.simulated=true;const c=clients.find(c=>c.id==='c5');c.status='review';c.note='Comprobante recibido';c.time='Ahora';operations.unshift({id:'o4',client:'c5',kind:'payment',title:'Nuevo comprobante recibido',description:'Valentina Ríos · comprobante de $169',time:'Ahora · simulado',done:false});notices.unshift({client:'c5',text:'Valentina envió un comprobante',sub:'Pago de $169 · ahora, simulado',read:false});events.unshift({text:'Valentina envió su comprobante',time:'Ahora · simulado'});const scroll=window.scrollY;transition(()=>{render();window.scrollTo(0,scroll)});toast('Evento simulado: Valentina pasó a pago en revisión.');$('#simulate').textContent='Comprobante simulado recibido'};
function route(){const page=location.hash.slice(1)||'inicio';state.page=sections.some(s=>s[0]===page)?page:'inicio';if($('#detail').open){$('#detail').close();$('#detail').style.viewTransitionName='';state.selected=null}transition(()=>{render();window.scrollTo(0,0)})}window.addEventListener('hashchange',route);render();if(location.hash)route();
</script></body></html>
