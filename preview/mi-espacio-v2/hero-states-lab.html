<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><base href="../../"><title>GOXION · laboratorio de estados</title><link rel="stylesheet" href="preview/mi-espacio-v2/official-feed.css?v=hero-states-20261126"><style>body{margin:0;background:#030305;color:#f5f8ff;font-family:Poppins,system-ui,sans-serif}main{max-width:430px;margin:32px auto;padding:0 16px}h1{font-size:23px}p{font-size:12px;color:#a8b5c9}#lab-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}#lab-actions button{padding:8px 14px;border:0;border-radius:999px;background:rgba(255,255,255,.08);color:#7ee1e7;font:600 12px system-ui;min-height:38px}</style></head><body><main><h1>Laboratorio de estados</h1><p>Datos simulados · no modifica clientes ni Admin.</p><div id="gx-v2-feed"><div class="focus" id="focus" data-tone="review" data-state="review" data-glass="on" data-material="neutral" data-layout="compact"><div class="focus-copy"><div class="focus-title" id="focus-title">Estamos revisando tu comprobante</div><span class="focus-meta">Ya lo recibimos</span></div><span class="focus-icon" data-icon="clock"><svg viewBox="0 0 24 24"><path id="state-path" d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18"/><path class="gx-focus-detail gx-focus-clock-fixed" d="M12 7v5"/><path class="gx-focus-detail gx-focus-clock-hand" d="M12 12l3 2"/></svg></span><div class="focus-bottom"><button class="focus-action" id="focus-action" type="button">Ver mi cuenta</button></div></div></div><div id="lab-actions"><button id="lab-start">Incidencia + cancelación</button><button id="lab-more">Más de dos situaciones</button><button id="lab-resolve">Resolver incidencia</button><button id="lab-reset">Sin situaciones adicionales</button></div><p id="lab-note" aria-live="polite"></p></main><script src="preview/mi-espacio-v2/hero-states.js?v=20261126"></script><script>const $=id=>document.getElementById(id);$('focus-action').onclick=()=>$('lab-note').textContent='En el espejo, abre Index con su controlador real.';const ctl=GOXION_HERO_STATES.create({card:$('focus'),storage:false,logo:n=>'logos/youtube.PNG',openCancellation:id=>$('lab-note').textContent='En el espejo, abre seguimiento del servicio '+id});const cancel=(id,n)=>({id,nombre:n,cancelacion:{id:'c'+id,estado:'solicitada'}});const a={id:'demo-alert',activa:true,plataforma:'YouTube Premium',falla:'presentando intermitencias temporales',mensaje:'Estamos dando seguimiento a la incidencia.'};let v={cliente:{id:'demo'},alertas:a,servicios:[cancel('1','Disney+')]};const refresh=()=>ctl.update(v,'review');$('lab-start').onclick=()=>{ctl.reset();v={cliente:{id:'demo'},alertas:a,servicios:[cancel('1','Disney+')]};refresh()};$('lab-more').onclick=()=>{v={...v,servicios:[cancel('1','Disney+'),cancel('2','Netflix'),cancel('3','Prime Video'),cancel('4','Max')]};refresh()};$('lab-resolve').onclick=()=>{v={...v,alertas:{...a,activa:false}};refresh()};$('lab-reset').onclick=()=>{ctl.reset();v={cliente:{id:'demo'},alertas:null,servicios:[]};refresh()};refresh();</script></body></html>
