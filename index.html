<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOXION // Estado de Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #030305;
      --card-bg: linear-gradient(145deg, #12121a, #08080c);
      --text-main: #ffffff;
      --text-muted: #8892b0;
      --neon-blue: #00f2fe;
      --neon-purple: #bc13fe;
      --success-green: #00ff9d;
      --warning-amber: #f8e800;
      --danger-red: #ff003c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; padding: 20px; 
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.05) 0%, transparent 50%);
    }
    
    .container { 
      width: 100%; max-width: 440px; 
      background: var(--card-bg); 
      border-radius: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      padding: 25px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
      position: relative;
      overflow: hidden;
    }

    /* Brillo superior dinámico */
    .top-glow { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); }

    .header { text-align: center; margin-bottom: 25px; }
    .logo-img { max-height: 45px; width: auto; display: block; margin: 0 auto; filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.3)); }
    .subtitle { color: var(--text-muted); font-size: 0.95rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }
    
    /* --- LA REGLA DE LOS 5 SEGUNDOS (HERO BALANCE) --- */
    .balance-hero { text-align: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); }
    .total-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
    .total-amount { font-size: 3.5rem; font-weight: 800; line-height: 1; margin-bottom: 12px; color: var(--neon-blue); text-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
    
    .time-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; border: 1px solid; }
    .badge-ok { background: rgba(0, 242, 254, 0.05); color: var(--neon-blue); border-color: rgba(0, 242, 254, 0.3); }
    .badge-today { background: rgba(248, 232, 0, 0.05); color: var(--warning-amber); border-color: rgba(248, 232, 0, 0.4); box-shadow: 0 0 10px rgba(248, 232, 0, 0.2); }
    .badge-overdue { background: rgba(255, 0, 60, 0.05); color: var(--danger-red); border-color: rgba(255, 0, 60, 0.4); box-shadow: 0 0 10px rgba(255, 0, 60, 0.2); }
    .badge-paid { background: rgba(0, 255, 157, 0.05); color: var(--success-green); border-color: rgba(0, 255, 157, 0.4); box-shadow: 0 0 10px rgba(0, 255, 157, 0.2); }

    /* --- INFO CLIENTE --- */
    .card-info { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .info-block { display: flex; flex-direction: column; }
    .info-block .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    .info-block .value { font-size: 1rem; font-weight: 700; color: var(--text-main); }
    .info-block.full { grid-column: span 2; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px; margin-top: -2px; }

    /* --- ALERTAS --- */
    .alert-banner { padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: 700; font-size: 0.95rem; border: 1px solid; text-transform: uppercase; letter-spacing: 1px; }
    .overdue-incentive-box { background: rgba(255, 0, 60, 0.1); border: 1px dashed rgba(255, 0, 60, 0.4); border-radius: 12px; padding: 15px; font-size: 0.9rem; line-height: 1.4; color: #ffb3c1; margin-bottom: 20px; text-align: center; font-weight: 600; }
    
    /* --- SERVICIOS --- */
    .section-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: var(--neon-purple); margin-bottom: 12px; font-weight: 700; border-left: 3px solid var(--neon-purple); padding-left: 8px; }
    
    .services-container { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 0 15px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; }
    .service-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); font-size: 1.05rem; }
    .service-item:last-child { border-bottom: none; }
    .service-name { font-weight: 700; color: var(--text-main); }
    .service-price { font-weight: 800; color: var(--text-muted); }
    
    /* --- DESGLOSE --- */
    .breakdown-box { background: rgba(0,0,0,0.5); border-radius: 12px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; }
    .breakdown-line { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .breakdown-line:last-child { margin-bottom: 0; }
    .discount-line { color: var(--success-green); }
    .surcharge-line { color: var(--danger-red); }

    /* --- PROGRAMA LEALTAD --- */
    .loyalty-badge { background: #12121a; border-radius: 12px; padding: 15px; border: 1px solid rgba(124, 77, 255, 0.3); margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
    .loyalty-icon { font-size: 2rem; line-height: 1; text-shadow: 0 0 15px rgba(188, 19, 254, 0.4); }
    .loyalty-content { flex: 1; }
    .loyalty-title { font-size: 0.85rem; color: var(--neon-purple); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .loyalty-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.3; font-weight: 600; }
    .loyalty-highlight { color: var(--text-main); font-weight: 700; }

    /* --- BOTONES --- */
    .actions-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border: none; outline: none; text-transform: uppercase; letter-spacing: 1px; }
    .btn:active { transform: translateY(2px); }
    
    .btn-copy { background: linear-gradient(135deg, var(--neon-blue), #4f8cff); color: #000; box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); }
    .btn-copy:hover { box-shadow: 0 0 25px rgba(0, 242, 254, 0.5); }

    .btn-paid { background: rgba(0, 255, 157, 0.05); color: var(--success-green); border: 1px dashed var(--success-green); cursor: default; }
    .btn-paid:active { transform: none; }

    .btn-wa { background: transparent; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.2); }
    .btn-wa:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }

    .footer { text-align: center; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; line-height: 1.5; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 15px; }
    .error-msg { text-align: center; color: var(--danger-red); padding: 20px 0; font-size: 1.1rem; font-weight: 700; }
    .loading { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 1.1rem; font-weight: 600; }
    
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--neon-purple); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.95rem; font-weight: 700; display: none; box-shadow: 0 0 15px rgba(188, 19, 254, 0.5); z-index: 1000; animation: fadeIn 0.3s ease;}
    @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  </style>
</head>
<body>

<div class="container" id="app">
  <div class="loading">Sincronizando con Goxion...</div>
</div>

<div class="toast" id="toast">📋 ¡Datos copiados al portapapeles!</div>

<script>
  const TELEFONO_GOXION = "528136836901"; 
  const CLABE_PAGO = "638180000167909381";
  const BANCO_PAGO = "NU BANCO";
  const TITULAR_PAGO = "Henry González";

  async function cargarEstadoCuenta() {
    const params = new URLSearchParams(window.location.search);
    const clienteKey = params.get('cliente')?.toLowerCase().trim();
    const app = document.getElementById('app');

    if (!clienteKey) {
      app.innerHTML = `<div class="error-msg">⚠️ ENLACE INCOMPLETO.<br><span style="font-size:0.9rem; color:var(--text-muted);">Falta el identificador del cliente en la URL.</span></div>`;
      return;
    }

    try {
      const response = await fetch('clientes.json', { cache: 'no-store' });
      if (!response.ok) throw new Error("No se pudo cargar clientes.json");
      
      const data = await response.json();
      const cliente = data[clienteKey];

      if (!cliente) {
        app.innerHTML = `<div class="error-msg">❌ CLIENTE NO ENCONTRADO.<br><span style="font-size:0.9rem; color:var(--text-muted);">El registro "${clienteKey}" no existe en el sistema.</span></div>`;
        return;
      }

      // 1. Cálculos de Fechas
      const hoy = new Date();
      const diaHoy = hoy.getDate();
      const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      const mesActual = meses[hoy.getMonth()];
      const periodoStr = `${mesActual} ${hoy.getFullYear()}`;
      
      const diaPago = cliente.dia_pago || 15;
      const difDias = diaPago - diaHoy; 
      
      let rachaOriginal = cliente.pagos_puntuales || 0;
      let racha = rachaOriginal;
      let perdioRacha = false;

      // REGLA: Si está vencido o suspendido, pierde racha visualmente
      if (cliente.estado !== 'pagado' && difDias < 0 && rachaOriginal > 0) {
          racha = 0;
          perdioRacha = true;
      }

      // 2. Cálculo de Subtotal de Servicios
      let subtotal = 0;
      let serviciosHTML = '';
      if (cliente.servicios && cliente.servicios.length > 0) {
        cliente.servicios.forEach(s => {
          subtotal += s.monto;
          serviciosHTML += `
            <div class="service-item">
              <span class="service-name">${s.nombre}</span>
              <span class="service-price">$${s.monto}</span>
            </div>
          `;
        });
      } else {
        serviciosHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.9rem; padding: 15px 0;">No tienes servicios activos asignados.</div>`;
      }

      // 3. Reglas de Mora, Recargos y Banderas
      let pctMoraDiaria = 0;
      let montoMora = 0;
      let montoBajaAdmin = 0;
      let diasAtraso = 0;
      
      let badgeClass = "";
      let badgeText = "";
      let uiColor = "var(--neon-blue)";
      
      let mensajeAtrasoHTML = "";

      if (cliente.estado === 'pagado') {
          badgeClass = "badge-paid";
          badgeText = "✅ Al corriente este mes";
          uiColor = "var(--success-green)";
      } else if (difDias > 0) {
          badgeClass = "badge-ok";
          badgeText = `⏳ Vence en ${difDias} día(s)`;
      } else if (difDias === 0) {
          badgeClass = "badge-today";
          badgeText = `⚠️ Tu corte es HOY`;
          uiColor = "var(--warning-amber)";
      } else {
          diasAtraso = Math.abs(difDias);
          badgeClass = "badge-overdue";
          badgeText = `🚨 Vencido hace ${diasAtraso} día(s)`;
          uiColor = "var(--danger-red)";

          let pctMoraCalculado = diasAtraso * 0.05;
          pctMoraDiaria = Math.min(pctMoraCalculado, 0.50);
          montoMora = Math.round(subtotal * pctMoraDiaria);
          let acumMoraTotal = subtotal + montoMora;

          if (diasAtraso > 15 || cliente.estado === 'suspendido') {
              montoBajaAdmin = Math.round(acumMoraTotal * 0.20);
          }

          mensajeAtrasoHTML = `
            <div class="overdue-incentive-box">
              🚨 <strong>Mora activa por falta de pago.</strong><br>
              Se aplica recargo automático del 5% diario (+${Math.round(pctMoraDiaria * 100)}% acum.). 
              ${(diasAtraso > 15 || cliente.estado === 'suspendido') ? `<br><strong style="color:var(--danger-red);">⚠️ Se incluyó un 20% de recargo por reactivación.</strong>` : ''}
              <br><small style="color:var(--text-muted); display:block; margin-top:6px;">Si prevés un retraso, notifícalo con antelación para evitar recargos.</small>
            </div>
          `;
      }

      // 4. Banner de Estado Global (Cancelaciones/Pagos)
      let bannerEstado = "";
      if (cliente.estado === 'suspendido') {
          bannerEstado = `<div class="alert-banner" style="background: rgba(255, 0, 60, 0.15); border-color: var(--danger-red); color: var(--danger-red); box-shadow: 0 0 15px rgba(255, 0, 60, 0.2);">⛔ Servicio Suspendido</div>`;
          uiColor = "var(--danger-red)";
      } else if (cliente.estado === 'pagado') {
          bannerEstado = `<div class="alert-banner" style="background: rgba(0, 255, 157, 0.15); border-color: var(--success-green); color: var(--success-green); box-shadow: 0 0 15px rgba(0, 255, 157, 0.2);">✅ Mensualidad Pagada</div>`;
      }

      // 5. Cálculo del Descuento por Fidelidad
      let pctDescuento = 0;
      let mensajeLealtad = '';

      if (racha >= 9) {
        pctDescuento = 0.06;
        mensajeLealtad = `Nivel 2 Activo: <span class="loyalty-highlight" style="color:var(--neon-purple);">6% de descuento</span> aplicado en tu total.`;
      } else if (racha >= 4) {
        pctDescuento = 0.03;
        const faltantes = 9 - racha;
        mensajeLealtad = `Nivel 1 Activo: <span class="loyalty-highlight" style="color:var(--neon-blue);">3% OFF</span>. Te faltan ${faltantes} pago(s) para subir a Nivel 2.`;
      } else {
        pctDescuento = 0;
        const faltantes = 4 - racha;
        mensajeLealtad = perdioRacha 
          ? `<span style="color:var(--danger-red);">💔 Racha reiniciada a 0 por atraso en el pago.</span>` 
          : `Progreso: <span class="loyalty-highlight">${racha}/4 pagos</span>. Faltan ${faltantes} pago(s) para alcanzar Nivel 1.`;
      }

      // 6. Gran Total Final y Botones Dinámicos
      let ahorro = (diasAtraso === 0 && cliente.estado !== 'suspendido') ? Math.round(subtotal * pctDescuento) : 0;
      let totalFinal = (subtotal - ahorro) + montoMora + montoBajaAdmin;
      
      let labelTotal = "Total a Pagar";
      let btnAccionHTML = `<button class="btn btn-copy" onclick="copiarDatos('${totalFinal}')">📋 Copiar Datos de Pago</button>`;

      // Si el Admin marcó como pagado, neutralizamos la deuda visualmente
      if (cliente.estado === 'pagado') {
          totalFinal = 0;
          labelTotal = "Saldo Pendiente";
          btnAccionHTML = `<button class="btn btn-paid" onclick="return false;">✅ Mensualidad Cubierta</button>`;
      }

      // 7. Generar Caja de Desglose (Ticket)
      let breakdownHTML = '';
      if (cliente.estado !== 'pagado' && (ahorro > 0 || montoMora > 0 || montoBajaAdmin > 0)) {
          breakdownHTML = `
            <div class="breakdown-box">
              <div class="breakdown-line" style="color: var(--text-muted);"><span>Subtotal Mensual</span><span>$${subtotal}</span></div>
              ${ahorro > 0 ? `<div class="breakdown-line discount-line"><span>Descuento Lealtad</span><span>-$${ahorro}</span></div>` : ''}
              ${montoMora > 0 ? `<div class="breakdown-line surcharge-line"><span>Mora (+${Math.round(pctMoraDiaria * 100)}%)</span><span>+$${montoMora}</span></div>` : ''}
              ${montoBajaAdmin > 0 ? `<div class="breakdown-line surcharge-line"><span>Cargo Reactivación</span><span>+$${montoBajaAdmin}</span></div>` : ''}
            </div>
          `;
      }

      const mensajeWA = encodeURIComponent(`Hola GOXION, requiero asistencia con mi cuenta.\n\n👤 Cliente: ${cliente.nombre}\n📄 Folio: ${cliente.folio}`);
      const urlWA = `https://wa.me/${TELEFONO_GOXION}?text=${mensajeWA}`;

      // Renderizado Final con Jerarquía Visual (La Regla de 5 segundos al frente)
      app.innerHTML = `
        <div class="top-glow" style="background: ${uiColor}; box-shadow: 0 0 15px ${uiColor}80;"></div>

        <div class="header">
          <img src="logo2.PNG" alt="GOXION" class="logo-img" onerror="this.src='Logo individual.png'">
          <div class="subtitle">Resumen de Cuenta</div>
        </div>

        ${bannerEstado}

        <!-- LA REGLA DE 5 SEGUNDOS (HERO SECTION) -->
        <div class="balance-hero">
            <div class="total-label">${labelTotal}</div>
            <div class="total-amount" style="color: ${uiColor}; text-shadow: 0 0 20px ${uiColor}60;">$${totalFinal.toFixed(2)}</div>
            <div class="time-badge ${badgeClass}">${badgeText}</div>
        </div>

        ${cliente.estado === 'pagado' ? '' : mensajeAtrasoHTML}

        <!-- DATOS DEL CLIENTE REDISEÑADOS -->
        <div class="card-info">
          <div class="info-block">
            <span class="label">Titular</span>
            <span class="value">${cliente.nombre.split(' ')[0]}</span>
          </div>
          <div class="info-block" style="text-align: right;">
            <span class="label">Folio</span>
            <span class="value" style="color:var(--neon-purple);">${cliente.folio}</span>
          </div>
          <div class="info-block full">
            <span class="label">Periodo Facturado</span>
            <span class="value" style="display:flex; justify-content:space-between;">
                ${periodoStr} 
                <span style="color:var(--text-muted); font-size:0.9rem;">Corte: ${diaPago} de ${mesActual}</span>
            </span>
          </div>
        </div>

        <div class="section-title">Servicios Activos</div>
        <div class="services-container" style="margin-bottom: ${breakdownHTML ? '10px' : '20px'};">
          ${serviciosHTML}
        </div>

        ${breakdownHTML}

        <div class="loyalty-badge">
          <div class="loyalty-icon">⭐</div>
          <div class="loyalty-content">
            <div class="loyalty-title">Programa Goxion</div>
            <div class="loyalty-desc">${mensajeLealtad}</div>
          </div>
        </div>

        <div class="actions-group">
          ${btnAccionHTML}
          <a href="${urlWA}" target="_blank" class="btn btn-wa">
            💬 Contactar a Soporte
          </a>
        </div>

        <div class="footer">
          <span style="color:var(--text-main);">🎁 <strong>¡Gana un mes gratis!</strong></span><br>
          Recomienda GOXION a un amigo y al contratar obtén un mes de descuento.
        </div>
      `;

    } catch (e) {
      app.innerHTML = `<div class="error-msg">⚠️ Error al cargar la base de datos.<br><span style="font-size:0.9rem; color:var(--text-muted);">Revisa tu conexión o contacta a soporte.</span></div>`;
    }
  }

  function copiarDatos(monto) {
    const texto = `GOXION - Datos de Transferencia\n\nBanco: ${BANCO_PAGO}\nTitular: ${TITULAR_PAGO}\nCLABE: ${CLABE_PAGO}\nMonto exacto: $${monto} MXN`;
    navigator.clipboard.writeText(texto).then(() => {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    });
  }

  cargarEstadoCuenta();
</script>

</body>
</html>
