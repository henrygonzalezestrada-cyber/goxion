<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOXION - Estado de Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
      --success-color: #2ea043;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 480px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .header { text-align: center; margin-bottom: 24px; }
    .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
    
    .card-info { background: #0d1117; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .info-row:last-child { margin-bottom: 0; }
    .label { color: var(--text-muted); }
    .value { font-weight: 600; }
    
    .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; }
    
    .service-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
    .service-item:last-child { border-bottom: none; }
    .service-name { font-weight: 500; }
    .service-price { font-weight: 600; color: #4facfe; }
    
    .total-box { background: rgba(79, 172, 254, 0.1); border: 1px solid #4facfe; border-radius: 12px; padding: 16px; text-align: center; margin: 20px 0; }
    .total-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    .total-amount { font-size: 32px; font-weight: 700; color: #00f2fe; margin-top: 4px; }
    
    .loyalty-badge { background: #1f242d; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .loyalty-title { font-size: 12px; color: #2ea043; font-weight: 600; text-transform: uppercase; }
    .loyalty-desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .footer { text-align: center; font-size: 12px; color: var(--text-muted); line-height: 1.5; border-top: 1px solid var(--border-color); padding-top: 16px; }
    .error-msg { text-align: center; color: #f85149; padding: 40px 0; }
  </style>
</head>
<body>

<div class="container" id="app">
  <div class="header">
    <img src="logo.png" alt="GOXION" style="max-width: 180px; height: auto; display: block; margin: 0 auto 10px auto;">
    <div class="subtitle">Gestión Digital de Suscripciones</div>
  </div>
  <div class="error-msg">Cargando estado de cuenta...</div>
</div>

<script>
  async function cargarEstadoCuenta() {
    const params = new URLSearchParams(window.location.search);
    const clienteKey = params.get('cliente')?.toLowerCase();
    const app = document.getElementById('app');

    if (!clienteKey) {
      app.innerHTML = `<div class="error-msg">⚠️ Enlace incompleto. Por favor verifica la URL entregada.</div>`;
      return;
    }

    try {
      const response = await fetch('clientes.json');
      const data = await response.json();
      const cliente = data[clienteKey];

      if (!cliente) {
        app.innerHTML = `<div class="error-msg">❌ Cliente no encontrado en el sistema GOXION.</div>`;
        return;
      }

      // Fechas automáticas
      const hoy = new Date();
      const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      const mesActual = meses[hoy.getMonth()];
      const periodoStr = `${mesActual} ${hoy.getFullYear()}`;
      
      let total = 0;
      let serviciosHTML = '';
      cliente.servicios.forEach(s => {
        total += s.monto;
        serviciosHTML += `
          <div class="service-item">
            <span class="service-name">${s.nombre}</span>
            <span class="service-price">$${s.monto} MXN</span>
          </div>
        `;
      });

      app.innerHTML = `
        <div class="header">
          <img src="logo.png" alt="GOXION" style="max-width: 180px; height: auto; display: block; margin: 0 auto 10px auto;">
          <div class="subtitle">Estado de Cuenta de Servicios</div>
        </div>

        <div class="card-info">
          <div class="info-row"><span class="label">Cliente:</span><span class="value">${cliente.nombre}</span></div>
          <div class="info-row"><span class="label">Folio:</span><span class="value">${cliente.folio}</span></div>
          <div class="info-row"><span class="label">Periodo:</span><span class="value">${periodoStr}</span></div>
          <div class="info-row"><span class="label">Fecha límite:</span><span class="value" style="color:#00f2fe;">15 de ${mesActual}</span></div>
        </div>

        <div class="section-title">Servicios Activos</div>
        <div style="background: #0d1117; border-radius: 12px; padding: 0 16px; border: 1px solid var(--border-color);">
          ${serviciosHTML}
        </div>

        <div class="total-box">
          <div class="total-label">Total a Pagar</div>
          <div class="total-amount">$${total} MXN</div>
        </div>

        <div class="loyalty-badge">
          <div class="loyalty-title">⭐ Programa de Fidelidad GOXION</div>
          <div class="loyalty-desc">Nivel Actual: <strong>Nivel ${cliente.nivel}</strong> | ¡Mantén tus pagos puntuales antes del día 15 y acumula beneficios exclusivos!</div>
        </div>

        <div class="footer">
          🎁 <strong>¡Gana un mes gratis!</strong><br>
          Recomienda GOXION a un amigo y al contratar obtén un mes de descuento en tu servicio preferido.
        </div>
      `;

    } catch (e) {
      app.innerHTML = `<div class="error-msg">⚠️ Error al cargar la información. Intenta de nuevo más tarde.</div>`;
    }
  }

  cargarEstadoCuenta();
</script>

</body>
</html>
