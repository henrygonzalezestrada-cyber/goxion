<!DOCTYPE html>
<html lang="es" data-goxion-version="1.0.2">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030305">
  <title>GOXION - Resumen de Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/index.css">







</head>
<body>

<div class="bg">
    <div class="lava lava-1"></div>
    <div class="lava lava-2"></div>
    <div class="lava lava-3"></div>
    <div class="lava lava-4"></div>
</div>

<div class="container" id="app">
  <div class="loading">Sincronizando con Goxion...</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">CLABE copiada</div>

<!-- GOXION PAY · SELECTOR DE CUENTA (beta con ?gxPay=beta) -->
<div class="gx-bank-overlay" id="bank-modal" onclick="cerrarDatosPago(event)" aria-hidden="true">
    <section class="gx-bank-sheet" role="dialog" aria-modal="true" aria-labelledby="gx-bank-title">
        <button class="gx-bank-close" type="button" onclick="cerrarDatosPago(event, true)" aria-label="Cerrar datos de transferencia">×</button>

        <div class="gx-bank-kicker">PAGO POR TRANSFERENCIA</div>
        <div class="gx-bank-heading">
            <h3 id="gx-bank-title">Transfiere <strong id="gx-bank-amount">$0.00</strong></h3>
            <p>Elige una cuenta.</p>
        </div>

        <div class="gx-bank-list" id="gx-bank-list"></div>

    </section>
</div>

<!-- MODAL DE PAGO PARA SUBIR COMPROBANTE -->
<div class="modal-overlay" id="payment-modal" onclick="cerrarModalPago(event)" aria-hidden="true">
    <div class="modal-content gx-payment-upload-sheet" role="dialog" aria-modal="true" aria-labelledby="gx-payment-upload-title">
        <button class="close-modal" type="button" onclick="cerrarModalPago(event, true)" aria-label="Cerrar comprobante">×</button>

        <div class="gx-payment-upload-head">
            <div class="gx-payment-upload-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M7 7.5h2l1.1-1.8h3.8L15 7.5h2A2.5 2.5 0 0 1 19.5 10v6.5A2.5 2.5 0 0 1 17 19H7a2.5 2.5 0 0 1-2.5-2.5V10A2.5 2.5 0 0 1 7 7.5Z"/>
                    <circle cx="12" cy="13" r="3"/>
                </svg>
            </div>
            <div class="gx-payment-upload-copy">
                <div class="gx-payment-upload-kicker">REPORTAR PAGO</div>
                <h3 id="gx-payment-upload-title">Sube tu comprobante</h3>
                <p>Selecciona la captura de tu transferencia.</p>
            </div>
        </div>

        <div class="upload-area" id="upload-area">
            <input type="file" id="file-input" accept="image/*" onchange="mostrarPreview(this)">
            <div class="upload-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M12 16V7m-4 4 4-4 4 4"/>
                    <path d="M5 17v1.2A2.8 2.8 0 0 0 7.8 21h8.4a2.8 2.8 0 0 0 2.8-2.8V17"/>
                </svg>
            </div>
            <div class="upload-text">
                <strong>Seleccionar captura</strong>
                <span>Foto o captura de tu transferencia</span>
            </div>
            <div class="gx-upload-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5"/></svg>
            </div>
        </div>

        <div id="preview-container">
            <img id="preview-img" src="" alt="Vista previa del comprobante">
            <div class="gx-preview-footer">
                <div class="gx-preview-ready">
                    <span class="gx-preview-ready-dot" aria-hidden="true"></span>
                    <span>Comprobante listo</span>
                </div>
                <button class="btn-change-img" type="button" onclick="reiniciarSubida()">Cambiar</button>
            </div>
        </div>

        <button class="btn-submit-payment" id="btn-enviar-comprobante" type="button" onclick="enviarComprobanteDiscord()" data-state="idle">
            <span class="gx-submit-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path class="gx-submit-send" d="M5 12h13m-5-5 5 5-5 5"/>
                    <circle class="gx-submit-spinner" cx="12" cy="12" r="7"/>
                    <path class="gx-submit-check" d="m6.8 12.4 3.2 3.2 7.2-7.2"/>
                    <path class="gx-submit-error" d="M8.3 8.3 15.7 15.7M15.7 8.3 8.3 15.7"/>
                </svg>
            </span>
            <span class="gx-submit-copy">
                <strong class="gx-submit-title">Enviar comprobante</strong>
                <small class="gx-submit-subtitle">Se enviará para validación</small>
            </span>
        </button>
    </div>
</div>

<script src="./assets/js/core/runtime.js"></script>
<script src="./assets/js/core/financial-engine.js"></script>
<script id="goxion-index-supabase-layer" src="./assets/js/index/01-index-supabase-layer.js"></script>


<script src="./assets/js/index/02-02-inline.js"></script>

<script src="./assets/js/index/03-03-inline.js"></script>
</body>
</html>
