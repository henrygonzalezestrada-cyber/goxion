<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOXION - Estado de Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --success-green: #2ea043;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 440px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .header { text-align: center; margin-bottom: 20px; }
    .logo-img { max-width: 200px; height: auto; display: block; margin: 0 auto; }
    .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
    
    .card-info { background: #0d1117; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .info-row:last-child { margin-bottom: 0; }
    .label { color: var(--text-muted); }
    .value { font-weight: 600; }
    
    .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
    
    .service-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
    .service-item:last-child { border-bottom: none; }
    .service-name { font-weight: 500; }
    .service-price { font-weight: 600; color: var(--accent-blue); }
    
    .total-box { background: rgba(79, 172, 254, 0.08); border: 1px solid var(--accent-blue); border-radius: 12px; padding: 16px; text-align: center; margin: 20px 0; }
    .total-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .total-amount { font-size: 32px; font-weight: 700; color: var(--accent-cyan); margin-top: 4px; }
    .discount-line { font-size: 12px; color: var(--success-green); font-weight: 600; margin-top: 4px; }
    
    .loyalty-badge { background: #1f242d; border-radius: 10px; padding: 14px; text-align: center; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .loyalty-title { font-size: 11px; color: var(--success-green); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .loyalty-desc { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }
    .loyalty-highlight { color: var(--text-main); font-weight: 600; }

    .footer { text-align: center; font-size: 12px; color: var(--text-muted); line-height: 1.5; border-top: 1px solid var(--border-color); padding-top: 16px; }
    .error-msg { text-align: center; color: #f85149; padding: 20px 0; font-size: 14px; }
    .loading { text-align: center; color: var(--text-muted); padding: 40px 0; }
  </style>
</head>
<body>

<div class="container" id="app">
  <div class="loading">Cargando datos del cliente...</div>
</div>

<script>
  async function cargarEstadoCuenta() {
    const params = new URLSearchParams(window.location.search);
    const clienteKey = params.get('cliente')?.toLowerCase().trim();
    const app = document.getElementById('app');

    if (!clienteKey) {
      app.innerHTML = `<div class="error-msg">⚠️ Enlace incompleto. Especifica un cliente en la URL.</div>`;
      return;
    }

    try {
      const response = await fetch('clientes.json');
      if (!response.ok) throw new Error("No se pudo cargar clientes.json");
      
      const data = await response.json();
      const cliente = data[clienteKey];

      if (!cliente) {
        app.innerHTML = `<div class="error-msg">❌ El cliente "<strong>${clienteKey}</strong>" no existe en el sistema GOXION.</div>`;
        return;
      }

      // Fechas
      const hoy = new Date();
      const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      const mesActual = meses[hoy.getMonth()];
      const periodoStr = `${mesActual} ${hoy.getFullYear()}`;
      
      // Cálculo del Sistema de Lealtad
      const racha = cliente.pagos_puntuales || 0;
      let nivel = 0;
      let pctDescuento = 0;
      let mensajeLealtad = '';

      if (racha >= 9) {
        nivel = 2;
        pctDescuento = 0.06; // 6%
        mensajeLealtad = `¡Felicidades! Tienes <span class="loyalty-highlight">Nivel 2</span> activo con un <span style="color:#2ea043; font-weight:700;">6% de descuento</span> conservado por tu puntualidad.`;
      } else if (racha >= 4) {
        nivel = 1;
        pctDescuento = 0.03; // 3%
        const faltantes = 9 - racha;
        mensajeLealtad = `¡Súper! Tienes <span class="loyalty-highlight">Nivel 1 (3% OFF)</span>. Te faltan <span class="loyalty-highlight">${faltantes} pago(s) puntual(es)</span> para subir al Nivel 2 (6% OFF).`;
      } else {
        nivel = 0;
        pctDescuento = 0;
        const faltantes = 4 - racha;
        mensajeLealtad = `Progreso actual: <span class="loyalty-highlight">${racha}/4 pagos</span>. Completa <span class="loyalty-highlight">${faltantes} pago(s) puntual(es) más</span> para desbloquear el Nivel 1 (3% OFF).`;
      }

      // Procesar servicios y subtotales
      let subtotal = 0;
      let serviciosHTML = '';
      
      if (cliente.servicios && cliente.servicios.length > 0) {
        cliente.servicios.forEach(s => {
          subtotal += s.monto;
          serviciosHTML += `
            <div class="service-item">
              <span class="service-name">${s.nombre}</span>
              <span class="service-price">$${s.monto} MXN</span>
            </div>
          `;
        });
      } else {
        serviciosHTML = `<div class="service-item"><span class="service-name">Sin servicios activos</span></div>`;
      }

      // Descuento final
      const ahorro = Math.round(subtotal * pctDescuento);
      const totalFinal = subtotal - ahorro;

      // HTML Render
      app.innerHTML = `
        <div class="header">
          <img src="logo.png" alt="GOXION" class="logo-img">
          <div class="subtitle">Estado de Cuenta de Servicios</div>
        </div>

        <div class="card-info">
          <div class="info-row"><span class="label">Cliente:</span><span class="value">${cliente.nombre}</span></div>
          <div class="info-row"><span class="label">Folio:</span><span class="value">${cliente.folio}</span></div>
          <div class="info-row"><span class="label">Periodo:</span><span class="value">${periodoStr}</span></div>
          <div class="info-row"><span class="label">Fecha límite:</span><span class="value" style="color:#00f2fe;">15 de ${mesActual}</span></div>
        </div>

        <div class="section-title">Servicios Activos</div>
        <div style="background: #0d1117; border-radius: 12px; padding: 0 16px; border: 1px solid var(--border-color);">
          ${serviciosHTML}
        </div>

        <div class="total-box">
          <div class="total-label">Total a Pagar</div>
          <div class="total-amount">$${totalFinal} MXN</div>
          ${ahorro > 0 ? `<div class="discount-line">🎉 ¡Ahorras $${ahorro} MXN por lealtad (${pctDescuento * 100}%)!</div>` : ''}
        </div>

        <div class="loyalty-badge">
          <div class="loyalty-title">⭐ PROGRAMA DE FIDELIDAD GOXION</div>
          <div class="loyalty-desc">${mensajeLealtad}</div>
        </div>

        <div class="footer">
          🎁 <strong>¡Gana un mes gratis!</strong><br>
          Recomienda GOXION a un amigo y al contratar obtén un mes de descuento.
        </div>
      `;

    } catch (e) {
      app.innerHTML = `<div class="error-msg">⚠️ Error de conexión al cargar la información.</div>`;
    }
  }

  cargarEstadoCuenta();
</script>

</body>
</html>
