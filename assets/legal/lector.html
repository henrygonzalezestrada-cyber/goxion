<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>GOXION · Documentos</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#090b10;color:#f2f4f8}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;background:#090b10ed;border-bottom:1px solid #ffffff18;padding:16px max(18px,calc((100vw - 780px)/2));display:flex;justify-content:space-between;gap:14px;align-items:center}a{color:#a8c5ff}header a{text-decoration:none}main{max-width:780px;margin:0 auto;padding:30px 20px 90px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}nav a{border:1px solid #ffffff2b;border-radius:999px;padding:9px 13px;text-decoration:none;font-size:13px}nav a[aria-current]{background:#f4f5f7;color:#12141b}article{line-height:1.75;font-size:15px}h1{font-size:clamp(26px,5vw,39px);line-height:1.2;margin:12px 0 26px}h2{font-size:22px;margin-top:35px}h3{font-size:18px;margin-top:26px}p{margin:12px 0}strong{color:white}small{color:#a3aab8}.note{color:#c0c6d3}button{border:1px solid #ffffff4a;background:#1d2430;color:white;padding:10px 14px;border-radius:12px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #a8c5ff;outline-offset:3px}</style></head>
<body><header><strong>GOXION <small>· Documentos</small></strong><a href="../../ayuda.html">Volver a Ayuda</a></header><main><nav aria-label="Documentos"><a href="?doc=terminos" data-doc="terminos">Términos generales</a><a href="?doc=referidos" data-doc="referidos">Referidos</a><a href="?doc=cupones" data-doc="cupones">Cupones y promociones</a></nav><article id="documento" aria-live="polite"><p>Cargando documento…</p></article><p class="note">Esta versión está en preparación y no modifica las condiciones vigentes hasta su publicación.</p></main>
<script>
(()=>{'use strict';
const files={terminos:'../../docs/legal/TERMINOS_GENERALES_V2.md',referidos:'../../docs/legal/BASES_REFERIDOS_V2.md',cupones:'../../docs/legal/BASES_CUPONES_PROMOCIONES_V2.md'};
const doc=new URLSearchParams(location.search).get('doc')||'terminos',key=Object.hasOwn(files,doc)?doc:'terminos';
document.querySelectorAll('[data-doc]').forEach(a=>{if(a.dataset.doc===key)a.setAttribute('aria-current','page')});
const target=document.getElementById('documento');
function inline(s){const frag=document.createDocumentFragment();const parts=s.split(/(\*\*[^*]+\*\*)/g);for(const p of parts){if(p.startsWith('**')&&p.endsWith('**')){const el=document.createElement('strong');el.textContent=p.slice(2,-2);frag.append(el)}else frag.append(document.createTextNode(p))}return frag}
function render(md){target.replaceChildren();let paragraph=[];const flush=()=>{if(!paragraph.length)return;const p=document.createElement('p');p.append(inline(paragraph.join(' ')));target.append(p);paragraph=[]};for(const line of md.split(/\r?\n/)){const match=/^(#{1,3})\s+(.*)$/.exec(line);if(match){flush();const h=document.createElement('h'+match[1].length);h.append(inline(match[2]));target.append(h)}else if(!line.trim())flush();else paragraph.push(line.trim())}flush()}
fetch(files[key],{credentials:'same-origin'}).then(r=>{if(!r.ok)throw Error('Documento no disponible');return r.text()}).then(render).catch(()=>{target.textContent='No fue posible abrir este documento. Inténtalo de nuevo desde Ayuda.'})})();
</script></body></html>
