name: GOXION · B2 Backend

on:
  push:
    branches:
      - feature/b2-atomic-full-payment-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-financiero:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contratos financieros y seguridad
        run: npm run verify
