name: GOXION · Admin visual preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'preview/admin-mobile-first/**'
      - 'scripts/admin-mobile-design-smoke.mjs'
      - '.github/workflows/admin-mobile-design.yml'
  workflow_dispatch:

jobs:
  preview-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser smoke · 280-1440 px
        run: node scripts/admin-mobile-design-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-design-screenshots
          path: artifacts/admin-design/
          if-no-files-found: ignore
