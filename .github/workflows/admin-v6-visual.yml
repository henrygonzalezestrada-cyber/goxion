name: GOXION Motion Lab 06 - Visual QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'preview/admin-v6-lab/**'
      - 'scripts/admin-v6-qa.mjs'
      - '.github/workflows/admin-v6-visual.yml'
  push:
    branches: [design/admin-v6-motion-lab-20261114]
    paths:
      - 'preview/admin-v6-lab/**'
      - 'scripts/admin-v6-qa.mjs'
      - '.github/workflows/admin-v6-visual.yml'
  workflow_dispatch:
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Test visual states, transitions, dates and navigation
        run: node scripts/admin-v6-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goxion-v6-motion-lab-screens
          path: artifacts/admin-v6/
          if-no-files-found: ignore
