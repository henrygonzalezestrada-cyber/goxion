name: GOXION · Goxy original renderer bundle (beta)
on:
  push:
    branches: [beta/goxy-original-robotheads]
    paths:
      - 'preview/goxion-ai/goxy-heads-entry.js'
      - 'preview/goxion-ai/package.json'
      - '.github/workflows/goxy-bundle-beta.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated renderer dependencies
        working-directory: preview/goxion-ai
        run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Bundle the actual robot-heads component for same-origin use
        working-directory: preview/goxion-ai
        run: npm run bundle
      - name: Verify bundle contains renderer and stays standalone
        run: |
          test -s preview/goxion-ai/goxy-heads.bundle.js
          node --check preview/goxion-ai/goxy-heads.bundle.js
      - name: Commit built asset on beta branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview/goxion-ai/goxy-heads.bundle.js
          if git diff --cached --quiet; then
            echo "Unchanged bundle."
          else
            git commit -m "build(goxy): robot-heads real Canvas bundle for beta preview"
            git push origin HEAD:beta/goxy-original-robotheads
          fi
