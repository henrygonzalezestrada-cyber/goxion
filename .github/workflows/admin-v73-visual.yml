name: GOXION Admin V7.3 - QA GOXION 60-30-10
on:
  push:
    branches: [design/admin-v7-3-goxion-603010-20261115]
    paths:
      - 'preview/admin-v73/**'
      - 'scripts/admin-v73-qa.mjs'
      - '.github/workflows/admin-v73-visual.yml'
  pull_request:
    branches: [main]
    paths:
      - 'preview/admin-v73/**'
      - 'scripts/admin-v73-qa.mjs'
      - '.github/workflows/admin-v73-visual.yml'
  workflow_dispatch:
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/admin-v73-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GOXION-V73-brand-preview-screenshots
          path: artifacts/admin-v73/
          if-no-files-found: ignore
