name: GOXION Admin V4 · Visual QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'preview/admin-v4/**'
      - 'scripts/admin-v4-qa.mjs'
      - '.github/workflows/admin-v4-visual.yml'
  workflow_dispatch:
jobs:
  design-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: npm install --no-save playwright
      - name: Instalar Chromium y WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Revisar navegación, fichas, fechas y responsive
        run: node scripts/admin-v4-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-v4-rendered-screens
          path: artifacts/admin-v4/
          if-no-files-found: ignore
