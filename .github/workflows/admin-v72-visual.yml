name: GOXION Admin V7.2 - QA Grid and Reactive UI
on:
  push:
    branches: [design/admin-v7-2-grid-reaction-20261115]
    paths:
      - 'preview/admin-v72/**'
      - 'scripts/admin-v72-qa.mjs'
      - '.github/workflows/admin-v72-visual.yml'
  pull_request:
    branches: [main]
    paths:
      - 'preview/admin-v72/**'
      - 'scripts/admin-v72-qa.mjs'
      - '.github/workflows/admin-v72-visual.yml'
  workflow_dispatch:
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/admin-v72-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GOXION-V72-reactive-screenshots
          path: artifacts/admin-v72/
          if-no-files-found: ignore
