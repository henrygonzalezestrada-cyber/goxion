name: GOXION · Integrity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Admin experience · signed authorization and recovery (fixtures)
        run: node --experimental-strip-types --test scripts/admin-experience-auth.test.mjs
      - name: Admin operations and credential guards (fixtures)
        run: node --experimental-strip-types --test scripts/sensitive-session-guards.test.mjs

      - name: C9 return geometry when RAF is delayed
        run: node --test scripts/promo-close-resilience.test.mjs

      - name: Auth resilience · deterministic WAAPI/RAF
        run: node --test scripts/auth-morph-resilience.test.mjs

      - name: Goxy H1 · piloto del espejo (controlador firmado simulado y alcance del cliente)
        run: |
          node --experimental-strip-types scripts/goxy-feedback-pilot-gateway.test.mjs
          node --test scripts/goxy-feedback-pilot-client.test.mjs

      - name: Goxy H2 · incidencias y visión piloto (servicios simulados)
        run: |
          node --test scripts/goxy-support-pilot-client.test.mjs
          node --experimental-strip-types --test scripts/goxy-support-pilot-gateway.test.mjs

      - name: Install browser test
        run: npm install --no-save playwright

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Auth resilience · Chromium/WebKit guest login and injected faults
        run: node scripts/auth-morph-resilience-smoke.mjs

      - name: Goxy · interpretación y diagnóstico contextual
        run: node --test scripts/goxy-dialog-routing.test.mjs scripts/goxy-diagnosis.test.mjs scripts/goxy-conversation-context.test.mjs scripts/goxy-learning-ui.test.mjs scripts/goxy-verified-learning.test.mjs scripts/goxy-learning-integration.test.mjs

      - name: Goxy · contrato HTTP de feedback QA (servicios simulados)
        run: node --experimental-strip-types scripts/goxy-feedback-gateway-qa.test.mjs

      - name: Goxy · aislamiento HTTP de feedback QA (guard real, red simulada)
        run: node --test scripts/goxy-qa-network-contract.test.mjs scripts/goxy-feedback-network-qa.test.mjs

      - name: Goxy · valoraciones animadas (Chromium/WebKit, servidor simulado)
        run: node scripts/goxy-learning-browser-smoke.mjs

      - name: Verify repository integrity
        run: npm run verify

      - name: Sesión legal · runtime único y aislamiento (simulado)
        if: ${{ !cancelled() }}
        run: node scripts/legal-session-runtime.test.mjs

      - name: Aceptación aislada · retorno de Index y guardia de producción (simulado)
        if: ${{ !cancelled() }}
        run: node scripts/qa-acceptance-return.test.mjs

      # Release Goxy must stay independent from legacy browser-smoke failures.
      - name: Goxy F17 oficial + aviso por cliente autenticado
        if: ${{ !cancelled() }}
        run: npm run test:goxy:oficial

      # Run the changed beta first so iPhone regressions surface immediately.
      - name: Opiniones 2.0 beta (local-only)
        if: ${{ !cancelled() }}
        run: npm run test:opiniones

      - name: Opiniones oficiales · flujo seguro simulado
        if: ${{ !cancelled() }}
        run: npm run test:opiniones:oficial

      - name: Opiniones espejo · transformación en la misma tarjeta
        if: ${{ !cancelled() }}
        run: node scripts/opiniones-inline-smoke.mjs

      - name: Goxy identidad visual · paleta y presencia única
        if: ${{ !cancelled() }}
        run: node scripts/goxy-identity-smoke.mjs

      - name: Continuidad del feed · lectura parcial y aislamiento
        if: ${{ !cancelled() }}
        run: node scripts/feed-continuity.test.mjs

      - name: Rendimiento del feed · consultas agrupadas y sesión
        if: ${{ !cancelled() }}
        run: node scripts/feed-performance.test.mjs

      - name: Rendimiento del feed · destinos y movimiento (Chromium/WebKit)
        if: ${{ !cancelled() }}
        run: node scripts/feed-performance-browser-smoke.mjs

      - name: Incidencias · sin aviso heredado en el candidato
        if: ${{ !cancelled() }}
        run: node scripts/hero-global-alert-guard.test.mjs

      - name: Tarjeta inteligente · estados secundarios (Chromium/WebKit)
        if: ${{ !cancelled() }}
        run: node scripts/hero-states-smoke.mjs

      - name: Browser smoke
        if: ${{ !cancelled() }}
        run: npm run test:smoke

      - name: Realtime beta browser smoke (mock data)
        if: ${{ !cancelled() }}
        run: npm run test:realtime

      - name: Cart guest and member checkout
        if: ${{ !cancelled() }}
        run: npm run test:cart

  modal-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: GOXION · Encabezados inmóviles y X global (Chromium/WebKit)
        run: npm run test:modales:estandar

  launch-announcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: GOXION · Guardas de activación y cola legal (VM)
        run: node --test scripts/launch-announcement-policy.test.mjs
      - name: GOXION · Novedades por capítulos (Chromium/WebKit, local)
        run: node scripts/launch-announcement-smoke.mjs
        env:
          GX_LAUNCH_SCREENSHOTS: launch-screenshots
      - name: Capturas de revisión (sin datos reales)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: goxion-block-f-screenshots
          path: launch-screenshots/*.png
          if-no-files-found: ignore
