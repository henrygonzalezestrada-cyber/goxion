name: GOXION · Integrity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify repository integrity
        run: npm run verify

      - name: Install browser test
        run: npm install --no-save playwright

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Browser smoke
        run: npm run test:smoke
