name: GOXION · Promo Package Live Check
on:
  push:
    branches: [hotfix-promo-multiperiod-package]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/promo-package-live-check.mjs
