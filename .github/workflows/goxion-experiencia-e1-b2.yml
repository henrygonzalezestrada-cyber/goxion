name: GOXION · Experiencia E1 B2 · Claridad financiera en espejo Beta
on:
  pull_request:
    branches: [main]
    paths:
      - 'preview/experiencia-financiera-espejo/**'
      - '.github/workflows/goxion-experiencia-e1-b2.yml'
  push:
    branches: [beta/e1b2-claridad-financiera-espejo-20261018, beta/e1b2-index-animate-ui-native-20261018]
    paths:
      - 'preview/experiencia-financiera-espejo/**'
      - '.github/workflows/goxion-experiencia-e1-b2.yml'
  workflow_dispatch:
concurrency:
  group: gx-e1-b2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  financial-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runner + genuine Animate UI v2 dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts playwright react@19 react-dom@19 motion@14 @animate-ui/react@2.0.0 @base-ui/react@1.8.0 lucide-react esbuild@0.25
      - name: Build self-contained Animate UI island (no external runtime CDN)
        run: npx esbuild preview/experiencia-financiera-espejo/animate-ui-native.entry.jsx --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=preview/experiencia-financiera-espejo/animate-ui-native.bundle.js
      - name: Regenerate Ayuda original mirror
        run: node preview/experiencia-mi-espacio-inteligente/build.mjs
      - name: Regenerate E1 B2 Ayuda mirror from approved B1
        run: node preview/experiencia-financiera-espejo/build.mjs
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Test due dates, proofs, privacy and mobile mirrors
        run: node preview/experiencia-financiera-espejo/check.mjs
      - name: Store verified mirror only — never official
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "A newer beta commit exists; refusing stale build"
            exit 0
          fi
          git add preview/experiencia-financiera-espejo/index.html preview/experiencia-financiera-espejo/animate-ui-native.bundle.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(beta): E1 B2 mirror verified [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
