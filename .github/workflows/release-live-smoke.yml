name: GOXION · Release Live Smoke

on:
  push:
    branches:
      - release-goxion-20260927
  workflow_dispatch:

jobs:
  live-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Railway + Supabase live smoke
        run: node scripts/release-live-smoke.mjs
