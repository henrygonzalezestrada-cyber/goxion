name: Mi Espacio espejo · integridad y navegador
on:
  push:
    paths:
      - 'preview/mi-espacio-espejo/**'
      - 'scripts/mi-espacio-espejo-smoke.mjs'
      - 'scripts/mi-espacio-espejo-browser.mjs'
      - '.github/workflows/mi-espacio-espejo.yml'
  pull_request:
    paths:
      - 'preview/mi-espacio-espejo/**'
      - 'scripts/mi-espacio-espejo-smoke.mjs'
      - 'scripts/mi-espacio-espejo-browser.mjs'
jobs:
  integridad:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar integridad, contratos y ausencia de escenarios
        run: node scripts/mi-espacio-espejo-smoke.mjs
  navegador:
    runs-on: ubuntu-latest
    needs: integridad
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Instalar Chromium y WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Probar navegación y estados en 390, 320 y 280 px
        run: node scripts/mi-espacio-espejo-browser.mjs
